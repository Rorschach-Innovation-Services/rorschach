<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tailings Dam Platform — Management Console</title>
<style>
  :root{
    --bg:#071320; --panel:#0f2233; --panel-2:#13293b; --sidebar:#0a1826;
    --line:#1f3a4f; --line-2:#16303f; --ink:#eaf2f8; --ink-dim:#9db3c4; --ink-mute:#6f8598;
    --green:#2ecc71; --green-bg:#123726; --amber:#f4b740; --amber-bg:#3a2e10;
    --red:#ff5a5a; --red-bg:#3a1717; --blue:#4aa3ff; --blue-bg:#0f2b45; --accent:#37c2b8;
    --radius:14px; --shadow:0 6px 22px rgba(0,0,0,.35);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  /* ---------- sidebar ---------- */
  aside{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand .logo{display:flex;align-items:center;gap:10px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--accent),#2b8f88);
    display:flex;align-items:center;justify-content:center;font-size:17px}
  .brand .name{font-weight:700;font-size:14px;letter-spacing:.2px}
  .brand .tag{font-size:10.5px;color:var(--ink-mute);margin-top:1px;letter-spacing:.3px;text-transform:uppercase}
  .facility{margin:12px;padding:11px 12px;background:#0c1f30;border:1px solid var(--line);border-radius:11px;cursor:pointer}
  .facility .fl{font-size:9.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px}
  .facility .fn{font-weight:650;font-size:14px;margin-top:2px;display:flex;align-items:center;justify-content:space-between}
  .facility .fm{font-size:11px;color:var(--ink-dim);margin-top:3px}
  nav{flex:1;padding:6px 10px;overflow-y:auto}
  nav .grp{font-size:9.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 10px 6px}
  nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--ink-dim);
    padding:10px 11px;border-radius:9px;font-size:13.5px;font-weight:550;cursor:pointer;text-align:left;position:relative}
  nav button .ic{font-size:16px;width:20px;text-align:center}
  nav button:hover{background:#0e2133;color:var(--ink)}
  nav button.active{background:#12324a;color:#fff}
  nav button.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
  nav button .badge{margin-left:auto;background:var(--red-bg);color:#ff9a9a;border:1px solid #5a2020;
    font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px}
  nav button .badge.amber{background:var(--amber-bg);color:#f7ce77;border-color:#5a4713}
  .who{padding:12px;border-top:1px solid var(--line)}
  .who .role{font-size:10px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
  select.rolesel{width:100%;background:#0c1f30;border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:8px 9px;font-size:12.5px;font-family:inherit;cursor:pointer}
  /* ---------- main ---------- */
  main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(7,19,32,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:15px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .topbar h1{font-size:18px;margin:0;font-weight:700}
  .topbar .crumb{font-size:11.5px;color:var(--ink-mute);margin-bottom:2px;letter-spacing:.3px}
  .topbar .actions{display:flex;align-items:center;gap:10px}
  .content{padding:22px 26px 60px;max-width:1240px;width:100%}
  /* ---------- pieces ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
  .card h2{font-size:11.5px;margin:0 0 3px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-dim)}
  .card h3{font-size:15px;margin:0 0 10px;font-weight:650}
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)} .g23{grid-template-columns:1.4fr 1fr}
  .muted{color:var(--ink-dim)} .mute{color:var(--ink-mute)} .small{font-size:12.5px} .tiny{font-size:11px}
  .mb{margin-bottom:16px} .row{display:flex;align-items:center;gap:10px}
  /* stat tile */
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
  .stat .lab{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .stat .num{font-size:33px;font-weight:750;letter-spacing:-1px;margin-top:8px;line-height:1}
  .stat .sub{font-size:11.5px;color:var(--ink-mute);margin-top:7px}
  .stat.good{border-color:#1c5a3a}.stat.warn{border-color:#5a4713}.stat.bad{border-color:#5a2020}
  /* pills */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:650;border:1px solid transparent;white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%}
  .pill.green{background:var(--green-bg);color:#7ce7a8;border-color:#1c5a3a}.pill.green .dot{background:var(--green)}
  .pill.amber{background:var(--amber-bg);color:#f7ce77;border-color:#5a4713}.pill.amber .dot{background:var(--amber)}
  .pill.red{background:var(--red-bg);color:#ff9a9a;border-color:#5a2020}.pill.red .dot{background:var(--red)}
  .pill.blue{background:var(--blue-bg);color:#9ccdff;border-color:#1d466b}.pill.blue .dot{background:var(--blue)}
  .pill.grey{background:#16232f;color:var(--ink-dim);border-color:var(--line)}.pill.grey .dot{background:var(--ink-mute)}
  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:0;font-size:13px;font-weight:650;cursor:pointer;background:var(--accent);color:#03201d}
  .btn.sec{background:#12293b;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--blue);border:1px solid #1d466b}
  .btn.danger{background:var(--red-bg);color:#ff9a9a;border:1px solid #5a2020}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn:active{transform:translateY(1px)}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-mute);
    font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line)}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2)}
  tbody tr{cursor:default}
  tbody tr.clk{cursor:pointer} tbody tr.clk:hover{background:#0e2133}
  td.mono,.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink-mute)}
  /* kv */
  .kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line-2);font-size:13.5px}
  .kv:first-child{border-top:0}.kv .k{color:var(--ink-dim)}.kv .v{font-weight:600;text-align:right}
  /* status row */
  .srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-2)}
  .hbar{height:8px;border-radius:999px;background:rgba(56,73,89,.13);overflow:hidden}
  .hbar>i{display:block;height:100%;border-radius:999px;animation:barGrow .8s cubic-bezier(.16,1,.3,1)}
  /* mission attachment viewer — media player / PDF / text */
  .mstage{position:relative;border-radius:12px;overflow:hidden;background:#0b1620;border:1px solid var(--line-2)}
  .mstage svg{display:block;width:100%}
  .mctrl{display:flex;align-items:center;gap:12px;margin-top:10px}
  .mplay{width:34px;height:34px;border-radius:50%;border:none;background:#88BDF2;color:#0b1620;font-size:12px;cursor:pointer;flex:none}
  .mscrub{flex:1;height:5px;border-radius:3px;background:rgba(56,73,89,.16);overflow:hidden}
  .mscrub>div{height:100%;background:#5b9bd9;border-radius:3px}
  .mfilm{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
  .mstrip{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:80px;padding:8px 6px;border-radius:9px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
  .mstrip.on{border-color:#88BDF2;background:rgba(136,189,242,.12)}
  .mstrip .nm{font-size:9.5px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:68px}
  .pdfbar{display:flex;justify-content:space-between;padding:6px 10px;background:rgba(56,73,89,.06);border:1px solid var(--line-2);border-bottom:none;border-radius:8px 8px 0 0}
  .pdfpage{background:#fff;color:#16222e;border:1px solid var(--line-2);border-radius:0 0 8px 8px;padding:24px 30px;box-shadow:0 10px 26px rgba(0,0,0,.14);max-height:50vh;overflow-y:auto}
  .pdfsec{margin-bottom:12px}
  .pdfsec h4{margin:0 0 3px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#6a7c8c}
  .pdfsec p{margin:0;font-size:12.5px;line-height:1.6;color:#2a3a48;white-space:pre-wrap}
  /* Gantt — compliance ⋈ operations */
  .ganttwrap{overflow-x:auto}
  .gantt{min-width:760px;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
  .gtrow{display:flex;align-items:stretch;border-top:1px solid var(--line-2)}
  .gtrow:first-child{border-top:none}
  .ghead{background:rgba(56,73,89,.05)}
  .glabel{flex:0 0 248px;min-width:248px;padding:7px 12px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:center}
  .gname{font-size:12px;font-weight:600;color:#26333f;line-height:1.25}
  .gsub{font-size:9.5px;color:var(--ink-dim);margin-top:2px}
  .grecur{color:#5b9bd9;font-weight:700}
  .gtrack{position:relative;flex:1;min-height:34px;background:linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 100%);background-size:calc(100%/6) 100%}
  .ghead .gtrack{min-height:26px}
  .gmonth{position:absolute;top:7px;font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-dim);transform:translateX(4px)}
  .gbar{position:absolute;top:50%;transform:translateY(-50%);height:16px;border-radius:5px;background:rgba(56,73,89,.10);border:1px solid var(--c);overflow:hidden}
  .gbar>i{display:block;height:100%;background:var(--c);opacity:.85}
  .ggate{position:absolute;top:50%;width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid #fff;z-index:3;box-shadow:0 1px 3px rgba(56,73,89,.4)}
  .ggate.green{background:#059669}.ggate.amber{background:#d97706}.ggate.grey{background:#8aa0b2}
  .ggatelbl{position:absolute;top:50%;transform:translateY(-50%);margin-left:11px;font-size:9px;font-weight:700;white-space:nowrap;z-index:2}
  .ggatelbl.green{color:#059669}.ggatelbl.amber{color:#b45309}.ggatelbl.grey{color:#66809a}
  .glane{padding:6px 12px;background:rgba(56,73,89,.055);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#526277;border-top:1px solid var(--line-2);border-left:3px solid var(--lc)}
  .gtoday{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #dc2626;opacity:.55;z-index:1}
  .gtoday-lbl{color:#dc2626 !important;font-weight:800}
  /* safety map layer toggles */
  .lyrbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .lyr{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:11.5px;color:var(--ink-dim);transition:background .15s,border-color .15s}
  .lyr.on{border-color:transparent;background:rgba(136,189,242,.16);color:#26333f;font-weight:600}
  .lyr:not(.on){opacity:.6}
  .lyr .ld{width:9px;height:9px;border-radius:2px;flex:none}
  /* satellite imagery gallery */
  .satgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .satcard{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .satimg{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:zoom-in;background:#0b1620;transition:filter .15s}
  .satimg:hover{filter:brightness(1.06)}
  .satmeta{padding:9px 12px 11px}
  .satname{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:#5b9bd9;font-weight:700}
  .satq{font-size:12.6px;font-weight:700;color:#26333f;margin-top:2px}
  .satshows{font-size:11.3px;color:var(--ink-dim);line-height:1.5;margin-top:4px}
  .satmain{width:100%;border-radius:12px;display:block;background:#0b1620;cursor:zoom-in;border:1px solid var(--line-2)}
  #satTabs .p2tab{color:#5b9bd9}
  #satTabs .p2tab.on{color:#26333f}
  .tl{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
  .tl.good{background:#34d399}.tl.amber{background:#fbbf24}.tl.bad{background:#f87171}
  .infobtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600;color:#26333f;cursor:pointer}
  .infobtn:hover{background:rgba(136,189,242,.14);border-color:transparent}
  .infobtn svg{width:14px;height:14px;flex:none}
  .videoslot{position:relative;aspect-ratio:16/9;border:1.5px dashed var(--line-2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(56,73,89,.05);text-align:center}
  .videoslot .vplay{width:54px;height:54px;border-radius:50%;background:#88BDF2;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(136,189,242,.5)}
  .wfstep{border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;margin-bottom:9px}
  .wfstep.off{opacity:.55;background:rgba(56,73,89,.03)}
  .wfrank{width:21px;height:21px;border-radius:50%;background:rgba(136,189,242,.22);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#3f5b78;flex:none}
  /* animated ordinal severity meter (structured observation) */
  .prow{padding:11px 0;border-top:1px solid var(--line-2);animation:prowIn .5s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--d)}
  @keyframes prowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .pmeter{position:relative;height:16px;margin-top:10px}
  .ptrack{position:absolute;top:6px;left:0;right:0;height:5px;border-radius:3px;background:rgba(56,73,89,.13)}
  .pfill{position:absolute;top:6px;left:0;height:5px;border-radius:3px;overflow:hidden;width:var(--w);animation:pGrow 1s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--d)}
  @keyframes pGrow{from{width:0}}
  .pfill::after{content:'';position:absolute;top:0;left:0;height:100%;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-140%);animation:pSheen 1.05s ease-out backwards;animation-delay:calc(var(--d) + .4s)}
  @keyframes pSheen{to{transform:translateX(360%)}}
  .pnotch{position:absolute;top:3.5px;width:2px;height:10px;border-radius:1px;background:rgba(56,73,89,.16);transform:translateX(-50%);transition:background .3s}
  .pnotch.on{background:var(--nc);opacity:.55}
  .pmark{position:absolute;top:8.5px;width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(56,73,89,.4);animation:pMark .5s cubic-bezier(.34,1.56,.5,1) backwards;animation-delay:var(--d);z-index:2}
  @keyframes pMark{from{opacity:0;transform:translate(-50%,-50%) scale(.1)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .pmark.pulse::after{content:'';position:absolute;inset:-2px;border-radius:50%;box-shadow:0 0 0 2px var(--cg);animation:pPulse 2s cubic-bezier(.16,1,.3,1) infinite;animation-delay:var(--d)}
  @keyframes pPulse{0%{box-shadow:0 0 0 2px var(--cg)}70%,100%{box-shadow:0 0 0 10px transparent}}
  .pscale{display:flex;justify-content:space-between;margin-top:7px;font-size:9px;letter-spacing:.4px;color:var(--ink-dim);text-transform:uppercase;opacity:.62}
  @media (prefers-reduced-motion:reduce){.prow,.pfill,.pmark,.pfill::after,.pmark.pulse::after{animation:none}}
  .p2gate{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line-2);border-radius:9px;margin-bottom:6px;cursor:pointer;transition:background .2s,border-color .2s}
  .p2gate:hover{background:rgba(136,189,242,.10)}
  .p2gate.on{border-color:rgba(5,150,105,.35);background:rgba(5,150,105,.06)}
  .p2box{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(56,73,89,.30);display:flex;align-items:center;justify-content:center;font-size:12px;color:#059669;font-weight:700;margin-top:1px}
  .p2gate.on .p2box{border-color:#059669;background:rgba(5,150,105,.12)}
  .p2bar{height:6px;border-radius:3px;background:rgba(56,73,89,.12);overflow:hidden}
  .p2bar>div{height:100%;background:#5b9bd9;transition:width .3s}
  .srow:first-of-type{border-top:0}.srow .grow{flex:1;min-width:0}
  .srow .t{font-weight:600;font-size:13.5px}.srow .s{font-size:12px;color:var(--ink-dim);margin-top:2px}
  /* banners */
  .banner{border-radius:11px;padding:12px 14px;font-size:12.5px;line-height:1.55;border:1px solid;margin-bottom:16px}
  .banner.info{background:var(--blue-bg);border-color:#1d466b;color:#bcd8f5}
  .banner.warn{background:var(--amber-bg);border-color:#5a4713;color:#f7ce77}
  .banner.crit{background:var(--red-bg);border-color:#5a2020;color:#ffb0b0}
  .banner b{color:#fff}
  /* chart */
  .chart{background:#0a1826;border:1px solid var(--line-2);border-radius:11px;padding:12px}
  .legend{display:flex;gap:16px;margin-top:9px;font-size:11px;color:var(--ink-dim);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:3px;border-radius:2px}
  /* freeboard stack */
  .fbstack{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .fbseg{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:7px;font-size:12px;font-weight:600}
  .fbcrest{background:#16303f;color:var(--ink-dim);border:1px dashed var(--line);font-size:11px;justify-content:center}
  /* filter tabs */
  .tabs{display:inline-flex;background:#0c1f30;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
  .tabs button{background:none;border:0;color:var(--ink-mute);padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
  .tabs button.on{background:#173a54;color:#fff}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(3,9,15,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;
    max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:scale(1);opacity:1}}
  .modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  .modal .mh h3{margin:0;font-size:17px}
  .modal .mb{padding:18px 20px}
  .x{background:#12293b;border:1px solid var(--line);color:var(--ink-dim);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;flex:none}
  .flash{position:fixed;right:24px;bottom:24px;z-index:60;background:#0c2b24;color:#8ff0cf;border:1px solid #1c5a3a;
    padding:12px 16px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s}
  .flash.show{opacity:1;transform:none}
  .tag2{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--ink-mute);text-transform:uppercase}
  .divider{height:1px;background:var(--line-2);margin:14px 0}
  .rolehide{display:none!important}

/* ---------- dam health questionnaire — scored AGAINST the credible failure modes ----------
   Not a generic condition survey: every question is a specific WARNING SIGN that the FMEA
   register (RA-01…RA-05) watches for that mode. Ordinal 0–3 (0 = best). Weights follow the
   mode's severity prior (overtopping & slope, sev 9, dominate). Comparators per the MAC scale
   (vs DESIGN / vs LAST ROUND / ABSOLUTE). FHI = 100 × (1 − Σ(score·w) / Σ(3·w)) is the weighted
   roll-up; each mode also yields its own sub-score, so the health number decomposes by failure
   mode — you see WHICH mode is dragging, not just an aggregate. The AQI scores the assessment.
   NO REDUNDANCY: a signal an instrument already measures is NOT re-asked here — freeboard (gauge
   board + M05), pond distance (M05 centroid), displacement rate (GNSS-2) and decant flow (FL-1)

function hashOf(str){
  let h1=0x811c9dc5,h2=0xc9dc5118;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,0x01000193);h2=Math.imul(h2^c,0x85ebca77);}
  const hx=n=>(n>>>0).toString(16).padStart(8,'0');
  return (hx(h1)+hx(h2)+hx(h1^h2)+hx(Math.imul(h1,31)^h2)).slice(0,40);
}

function sectionOf(view){
  return NAV.find(s=>s.landing===view || s.items.some(i=>i.key===view)) || NAV[0];
}
function renderNav(){
  const n=$('#nav'); n.innerHTML='';
  const active=sectionOf(state.view);
  NAV.forEach(sec=>{
    const isActive=sec===active, leaf=sec.items.length===0;
    const cls=leaf?(isActive?'here':''):(isActive?'exp':'');
    const b=h(`<button class="secbtn ${cls}">
      <span class="ic">${NAV_ICONS[sec.ic]||''}</span>
      <span class="lbl">${sec.label}</span>
      ${sec.step?`<span class="step">${sec.step}</span>`:''}
      ${leaf?'':`<span class="chev">${isActive?'▾':'▸'}</span>`}</button>`);
    b.onclick=()=>{state.view=sec.landing;render();};
    n.appendChild(b);
    if(isActive && !leaf){
      const sub=h(`<div class="subnav"></div>`);
      sec.items.forEach(it=>{
        const on=state.view===it.key;
        const ib=h(`<button class="subitem ${on?'on':''}"><span>${it.label}</span>
          ${it.badge?`<span class="badge">${it.badge}</span>`:''}</button>`);
        ib.onclick=()=>{state.view=it.key;render();};
        sub.appendChild(ib);
      });
      n.appendChild(sub);
    }
  });
}

/* count-up animation for numeric stat tiles (v3 motion) */
function animateStatNums(){
  document.querySelectorAll('.stat .num').forEach(el=>{
    const txt=el.textContent.trim();
    const m=txt.match(/^([−-]?)(R?)(\d[\d,]*)(%|\/\d+| due| amber| red)?$/);
    if(!m)return;
    const target=parseInt(m[3].replace(/,/g,''),10);
    if(!isFinite(target)||target<=0)return;
    const useComma=m[3].includes(','), t0=performance.now(), dur=650;
    const step=t=>{
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      const n=Math.round(target*e);
      el.textContent=(m[1]||'')+(m[2]||'')+(useComma?n.toLocaleString('en-US'):n)+(m[4]||'');
      if(p<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function attentionItems(){
  const a=[];

  if(schedule.some(s=>s.status==='overdue')) a.push({sev:'red',ic:'📝',t:'West wall routine is 2 days overdue',
    s:'Escalates to the Responsible Executive if not actioned — dispatch it now',go:'jobcards',act:'Dispatch'});
  if(eprpDoc().status!=='on_file') a.push({sev:'red',ic:'🚨',t:'EPRP is not filed — the only red GISTM topic',
    s:'Topic V requires a tested response plan; file it and plan the cascade drill',go:'emergency',act:'File EPRP'});
  // amber — attend
  if(alerts.some(x=>x.state==='escalated')) a.push({sev:'amber',ic:'💧',t:'Seepage at the west wall toe awaits the Engineer of Record',
    s:'Escalated 19 Jul (AL-31) · follow-up job card in progress',go:'alerts',act:'Review'});
  instruments.filter(i=>i.status!=='live').forEach(i=>a.push({sev:'amber',ic:'📡',t:i.id+' is offline',
    s:'Coverage reduced — Detection re-scored on every mode it watches until repaired',go:'instruments',act:'Repair'}));
  instruments.filter(i=>i.calibOver).forEach(i=>a.push({sev:'amber',ic:'⚖️',t:i.id+' calibration overdue ('+i.calib+')',
    s:'Readings carry reduced confidence until recalibrated',go:'instruments',act:'Instruments'}));
  const amb=tarps.filter(t=>evalTarp(t)[0]==='amber');
  if(amb.length) a.push({sev:'amber',ic:'🚦',t:amb.length+' TARP observable'+(amb.length>1?'s':'')+' in amber ('+amb.map(t=>t.id).join(', ')+')',
    s:'Cross-check streams corroborating before escalation — the fusion rule',go:'tarp',act:'Thresholds'});
  riskRegister.filter(r=>r.status==='review_due').forEach(r=>a.push({sev:'amber',ic:'🎯',t:r.id+' risk review due '+r.next,
    s:'GISTM IV: 3-yearly review cycle — EoR sign-off required',go:'risk',act:'Review'}));
  const undisc=correctiveActions.filter(c=>{const p=discProgress(c); return p.done>0&&p.done<p.total;});

    s:'Topic VI: finish the checklist so the quarterly pack can cite them',go:'risk',act:'Disclose'});

    s:'Plan it and it books onto the Schedule calendar automatically',go:'emergency',act:'Plan drill'});
  grievances.filter(g=>g.status!=='resolved').forEach(g=>a.push({sev:'amber',ic:'🗣️',t:g.id+' grievance open — response due '+(g.due||'soon'),
    s:g.summary+' ('+g.from+')',go:'stakeholders',act:'Respond'}));
  if(reviews.some(r=>r.open)) a.push({sev:'amber',ic:'🔍',t:'Independent review finding open (RV-02)',
    s:'Dam Safety Review finding carried in CA-04 — action or close it',go:'reviews',act:'Reviews'});
  competency.filter(c=>c.status!=='current').forEach(c=>a.push({sev:'amber',ic:'🎓',t:c.person+' — '+c.role+' competency '+c.status,
    s:'Renewal due '+c.due+' — an unqualified judgment is an audit finding',go:'competency',act:'Renew'}));

/* Standardised structured observation — turns a free-text finding into a measurable output.
   Every seepage observation scores the SAME closed-ended ordinal parameters (0 best → 3 worst),
   producing a weighted Observation Severity Index (0–100), a confidence, and a MAC-style band. */
const structuredObs={
  id:'OBS-0031', alert:'AL-31', category:'Seepage', point:'IP-02', pointName:'West wall toe',
  gps:{lat:-25.6792,lng:27.2277}, by:'J. Peters', when:'19 Jul 07:51', method:'Visual + reference photo',
  confidence:88, failureMode:'RA-03', tarp:'T-04',
  fields:[
    {k:'Occurrence', comp:'vs last round', w:3, scale:['None','Existing','Changed / grown','New'], v:3},
    {k:'Water colour', comp:'absolute', w:3, scale:['Clear','Slightly turbid','Turbid','Discoloured'], v:1},
    {k:'Clarity', comp:'absolute', w:2, scale:['Clear','Hazy','Murky','Opaque'], v:1},
    {k:'Flow rate', comp:'absolute', w:2, scale:['Damp','Seep','Trickle','Flowing'], v:1, note:'≈0.5 L/min est.'},
    {k:'Extent', comp:'vs last round', w:1, scale:['Spot','< 1 m','1–3 m','> 3 m'], v:1},
  ],
};
function obsSeverity(o){
  const num=o.fields.reduce((s,f)=>s+f.v*f.w,0), den=o.fields.reduce((s,f)=>s+3*f.w,0);
  const idx=Math.round(100*num/den);
  const band=idx>=75?['red','High']:idx>=50?['amber','Elevated']:idx>=25?['blue','Moderate']:['green','Low'];
  return {idx,band};
}

/* The workflow feed = scheduled rounds (projected from schedEvents — the genuine schedule link)
   merged with the stream signals, sorted newest-first. Editing a scheduled row amends the
   schedule event itself, so a fix on the overview shows on the Schedule too. */
function inspectionFeed(){
  const rows=[];
  schedEvents.filter(e=>['completed','missed','dispatched'].includes(e.status)).forEach(e=>{
    const st=e.status==='completed'?(e.flags?'attention':'done'):e.status==='missed'?'overdue':'due';

      what:e.level+' — '+e.scope+(e.insp?' · '+e.insp:'')+(e.jc?' · '+e.jc:'')+(e.note?' · '+e.note:''),
      when:CAL_MONTHS[e.m].name.split(' ')[0]+' '+e.d+' '+e.time,
      status:st, ord:e.m*100+e.d+(parseInt(e.time)/24)});
  });
  signalFeed.forEach((s,i)=>rows.push({kind:'signal', ref:s, idx:i, src:s.src, what:s.what, when:s.when, status:s.status, ord:s.ord}));
  return rows.sort((a,b)=>b.ord-a.ord);
}

const STREAM_TAG={satellite:'🛰️',drone:'🚁',iot:'📡',manual:'📝',procedure:'📋'};
function riskMatrixSVG(){
  const W=520,H=250,pad=40,cell=(W-2*pad)/5,cellY=(H-2*pad)/5;
  const bandOf=n=>Math.min(4,Math.floor((n-1)/2));
  let cells='';
  for(let s=0;s<5;s++)for(let o=0;o<5;o++){
    const prod=(s+1)*(o+1);
    const col=prod>=15?'rgba(248,113,113,.28)':prod>=8?'rgba(251,191,36,.22)':'rgba(52,211,153,.14)';
    cells+=`<rect x="${pad+o*cell}" y="${pad+(4-s)*cellY}" width="${cell-2}" height="${cellY-2}" fill="${col}" rx="4"/>`;
  }
  const byCell={};
  riskRegister.forEach(r=>{const k=bandOf(r.sev)+'_'+bandOf(r.occ);(byCell[k]=byCell[k]||[]).push(r.id.replace('RA-',''));});
  const labels=Object.entries(byCell).map(([k,ids])=>{
    const [s,o]=k.split('_').map(Number);
    return `<text x="${pad+o*cell+cell/2}" y="${pad+(4-s)*cellY+cellY/2+4}" text-anchor="middle" fill="#e9eff7" font-size="11" font-weight="700">RA ${ids.join(',')}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="250">
    ${cells}${labels}
    <text x="${pad-8}" y="${pad+10}" text-anchor="end" fill="#94a8bd" font-size="10">Sev 9–10</text>
    <text x="${pad-8}" y="${H-pad-6}" text-anchor="end" fill="#94a8bd" font-size="10">Sev 1–2</text>
    <text x="${pad}" y="${H-pad+16}" fill="#94a8bd" font-size="10">Occ 1–2</text>
    <text x="${W-pad}" y="${H-pad+16}" text-anchor="end" fill="#94a8bd" font-size="10">Occ 9–10</text>
    <text x="${W/2}" y="${H-8}" text-anchor="middle" fill="#5f7488" font-size="10">Occurrence →</text>
    <text x="12" y="${H/2}" fill="#5f7488" font-size="10" transform="rotate(-90 12 ${H/2})">Severity →</text>
  </svg>`;
}
function renderRisk(){
  const v=$('#view'); v.innerHTML='';
  v.appendChild(h(`<div class="banner info">🎯 <b>A living register, not a shelf document.</b> The qualitative analysis (mechanism, warning signs, consequence) is captured once with the engineer; the quantitative scores (Severity × Occurrence × Detection, 1–10) are kept honest by the platform — <b>Detection re-scores itself from the live monitoring state</b>. An offline instrument degrades Detection on every mode it watches until it's repaired.</div>`));

  const totBefore=riskRegister.reduce((s,r)=>s+r.sev*r.occ*r.detWas,0);
  const totNow=riskRegister.reduce((s,r)=>s+r.sev*r.occ*liveDetection(r).d,0);
  const drop=Math.round((1-totNow/totBefore)*100);
  const degraded=riskRegister.filter(r=>liveDetection(r).down.length);
  const due=riskRegister.filter(r=>r.status==='review_due');
  const top=riskRegister.slice().sort((a,b)=>b.sev*b.occ*liveDetection(b).d-a.sev*a.occ*liveDetection(a).d)[0];

  const grid=h(`<div class="grid g4 mb"></div>`);
  grid.appendChild(h(`<div class="stat good"><div class="lab">Portfolio RPN</div><div class="num">−${drop}%</div><div class="sub">${totBefore} baseline → ${totNow} live — the Detection dividend</div></div>`));
  grid.appendChild(h(`<div class="stat warn"><div class="lab">Highest live RPN</div><div class="num" style="font-size:20px;padding-top:9px">${top.id}</div><div class="sub">${top.mode} · RPN ${top.sev*top.occ*liveDetection(top).d}</div></div>`));
  grid.appendChild(h(`<div class="stat ${degraded.length?'warn':'good'}"><div class="lab">Detection degraded</div><div class="num">${degraded.length}</div><div class="sub">${degraded.length?degraded.map(r=>r.id).join(', ')+' — instrument offline':'all watching instruments live'}</div></div>`));
  grid.appendChild(h(`<div class="stat ${due.length?'warn':'good'}"><div class="lab">Reviews</div><div class="num">${due.length?due.length+' due':'Current'}</div><div class="sub">${due.length?due.map(r=>r.id+' — '+r.next).join(', '):'3-yearly per GISTM IV'}</div></div>`));
  v.appendChild(grid);

  if(canAct()){const b=h(`<button class="btn" style="margin-bottom:16px">🎯 New assessment</button>`); b.onclick=newRiskAssessment; v.appendChild(b);}

  const cols=h(`<div class="grid g23 mb"></div>`);
  const tbl=h(`<div class="card" style="padding:6px 6px 2px"><table><thead><tr>
    <th>ID</th><th>Failure mode</th><th>S</th><th>O</th><th>D <span class="mute">(was→live)</span></th><th>RPN <span class="mute">(was→live)</span></th><th>Band</th><th>Review</th></tr></thead><tbody></tbody></table></div>`);
  riskRegister.forEach(r=>{
    const ld=liveDetection(r), rpn=r.sev*r.occ*ld.d, was=r.sev*r.occ*r.detWas, band=rpnBand(rpn);
    const tr=h(`<tr class="clk">
      <td class="mono">${r.id}</td>
      <td><div style="font-weight:600">${r.mode}</div>${ld.down.length?`<div class="tiny" style="color:#fcd34d;margin-top:2px">⚠ +1 Detection — ${ld.down.join(', ')} offline</div>`:''}</td>
      <td>${r.sev}</td><td>${r.occ}</td>
      <td><span class="mute">${r.detWas}</span> → <b>${ld.d}</b>${ld.d!==r.det?' <span class="tiny" style="color:#fcd34d">('+r.det+'+1)</span>':''}</td>
      <td><span class="mute">${was}</span> → <b>${rpn}</b></td>
      <td><span class="pill ${band[0]}"><span class="dot"></span>${band[1]}</span></td>
      <td>${r.status==='review_due'?'<span class="pill amber"><span class="dot"></span>'+r.next+'</span>':'<span class="muted">'+r.next+'</span>'}</td></tr>`);
    tr.onclick=()=>riskDetail(r);
    tbl.querySelector('tbody').appendChild(tr);
  });
  cols.appendChild(tbl);

  const side=h(`<div class="grid" style="gap:16px;align-content:start"></div>`);
  side.appendChild(h(`<div class="card"><h2>Risk matrix — Severity × Occurrence</h2>
    <div class="chart" style="margin-top:8px">${riskMatrixSVG()}</div>
    <div class="tiny mute" style="margin-top:8px">Position is the qualitative judgment; the Detection axis (not shown) is what the platform moves. Click a register row for the full assessment.</div></div>`));
  side.appendChild(h(`<div class="card"><h2>The Detection axis is the product thesis</h2>
    <p class="small muted" style="line-height:1.6;margin:6px 0 0">Severity is fixed by the consequence class. Occurrence moves only with slow, capital engineering. <b>Detection is the axis this platform moves directly</b> — deploy, re-score, and report the RPN reduction per failure mode. That −${drop}% is the number for the risk committee, the insurer and the board — and it's auditable, because every re-score is a ledger event.</p></div>`));
  cols.appendChild(side);
  v.appendChild(cols);

  // Corrective actions per failure mode + GISTM Topic VI disclosure state
  const caCard=h(`<div class="card" style="padding:16px 18px 6px"><h2>🛠️ Corrective actions — one per failure mode, publicly disclosed</h2>
    <div class="tiny mute" style="margin:2px 0 8px">Every mode carries its corrective action (CAPA, M13) — and each action carries the GISTM Topic VI disclosure checklist. Disclosure is demonstrable: every ticked step is a ledger event.</div>
    <table><thead><tr><th>ID</th><th>Failure mode</th><th>Corrective action</th><th>Owner · due</th><th>Status</th><th>Public disclosure</th><th></th></tr></thead><tbody></tbody></table></div>`);
  correctiveActions.forEach(ca=>{
    const r=riskRegister.find(x=>x.id===ca.risk);
    const pr=discProgress(ca);
    const st={in_progress:['amber','In progress'],planned:['grey','Planned'],complete:['green','Complete']}[ca.status];
    const tr=h(`<tr><td class="mono">${ca.id}</td>
      <td><span class="mono tiny">${ca.risk}</span><div style="font-weight:600;font-size:12.5px">${r?r.mode:''}</div></td>
      <td style="font-size:12.5px">${ca.action}</td>
      <td class="muted" style="font-size:12px">${ca.owner}<br>${ca.due}</td>
      <td><span class="pill ${st[0]}"><span class="dot"></span>${st[1]}</span></td>
      <td style="min-width:120px"><div class="bar" style="height:7px"><i style="width:${pr.pct}%"></i></div>
        <div class="tiny ${pr.done===pr.total?'':'mute'}" style="margin-top:3px;${pr.done===pr.total?'color:#6ee7b7':''}">${pr.done}/${pr.total} steps${pr.done===pr.total?' — disclosed ✓':''}</div></td>
      <td><button class="btn sec sm">📢 Checklist</button></td></tr>`);
    tr.querySelector('button').onclick=()=>disclosureChecklist(ca);
    caCard.querySelector('tbody').appendChild(tr);
  });
  v.appendChild(caCard);
}
function disclosureChecklist(ca){
  const r=riskRegister.find(x=>x.id===ca.risk);
  const pr=discProgress(ca);
  const rows=DISC_STEPS.map(([k,t,s],i)=>{
    const done=ca.disc[k];
    const prevDone=i===0||ca.disc[DISC_STEPS[i-1][0]];
    return `<div class="srow" style="align-items:flex-start">
      <span class="pill ${done?'green':prevDone?'amber':'grey'}" style="min-width:76px;justify-content:center">${done?'✓ Done':prevDone?'Next':'Waiting'}</span>
      <div class="grow"><div class="t" style="font-size:13.5px">${i+1}. ${t}</div><div class="s">${s}</div></div>
      ${!done&&prevDone&&canAct()?`<button class="btn sm" data-k="${k}">Mark done</button>`:''}</div>`;
  }).join('');
  openModal('📢 Public disclosure — '+ca.id+' ('+ca.risk+')',`
    <div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <span class="pill ${pr.done===pr.total?'green':'amber'}"><span class="dot"></span>${pr.done}/${pr.total} steps complete</span>
      <span class="pill grey">${r?r.mode:''}</span></div>
    <div class="banner info" style="margin-bottom:6px"><b>${ca.action}</b> — owner ${ca.owner}, due ${ca.due}. GISTM Topic VI: affected communities and stakeholders are told what is being done, in plain language, with the evidence trail attached. Steps complete <b>in order</b>.</div>
    ${rows}
    ${pr.done===pr.total?'<div class="banner info" style="margin-top:12px">✅ Fully disclosed — this action appears in the quarterly Topic VI disclosure pack with its ledger references.</div>':''}`,
    `<button class="btn sec" id="dc_close">Close</button>`);
  $('#dc_close').onclick=closeModal;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    ca.disc[k]=true;
    const step=DISC_STEPS.find(x=>x[0]===k);
    pushEvent('disclosure_step',ca.id+' disclosure — '+step[1]+' ('+ca.risk+')');
    const now=discProgress(ca);
    if(now.done===now.total){ca.status=ca.status==='planned'?'in_progress':ca.status;
      pushEvent('corrective_action',ca.id+' publicly disclosed — all Topic VI steps complete ('+ca.risk+')');}
    flash(step[1]+' — logged'); if(state.view==='risk')render(); disclosureChecklist(ca);
  });
}
function riskDetail(r){
  const ld=liveDetection(r), rpn=r.sev*r.occ*ld.d, was=r.sev*r.occ*r.detWas, band=rpnBand(rpn);
  openModal(r.id+' — '+r.mode,`
    <div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <span class="pill ${band[0]}"><span class="dot"></span>${band[1]} · RPN ${rpn}</span>
      <span class="pill grey">baseline ${was}</span>
      ${r.status==='review_due'?'<span class="pill amber"><span class="dot"></span>Review due '+r.next+'</span>':'<span class="pill green"><span class="dot"></span>Reviewed '+r.reviewed+'</span>'}
      <span class="pill grey">Owner · ${r.owner}</span></div>
    <h2 style="margin:0 0 4px">Qualitative analysis</h2>
    <div class="kv"><span class="k" style="min-width:110px">Mechanism</span><span class="v" style="font-weight:500;text-align:left">${r.mechanism}</span></div>
    <div class="kv"><span class="k" style="min-width:110px">Warning signs</span><span class="v" style="font-weight:500;text-align:left">${r.warning}</span></div>
    <div class="kv"><span class="k" style="min-width:110px">Consequence</span><span class="v" style="font-weight:500;text-align:left">${r.consequence}</span></div>
    <h2 style="margin:16px 0 4px">Quantitative inputs — with their qualitative rationale</h2>
    <div class="kv"><span class="k">Severity ${r.sev}/10</span><span class="v" style="font-weight:500">${r.why.sev}</span></div>
    <div class="kv"><span class="k">Occurrence ${r.occ}/10</span><span class="v" style="font-weight:500">${r.why.occ}</span></div>
    <div class="kv"><span class="k">Detection ${ld.d}/10 <span class="mute">(was ${r.detWas})</span></span><span class="v" style="font-weight:500">${r.why.det}${ld.down.length?'<br><span style="color:#fcd34d">⚠ +1 while '+ld.down.join(', ')+' offline</span>':''}</span></div>
    <h2 style="margin:16px 0 4px">Controls — the barriers, with live status</h2>
    ${r.controls.map(c=>`<div class="srow"><span style="width:22px;text-align:center">${STREAM_TAG[c[1]]||'•'}</span>
      <div class="grow"><div class="t" style="font-size:13px">${c[0]}</div></div>
      <span class="pill green"><span class="dot"></span>${c[2]}</span></div>`).join('')}
    ${(()=>{const ca=correctiveActions.find(c=>c.risk===r.id); if(!ca)return '';
      const pr=discProgress(ca);
      return `<h2 style="margin:16px 0 4px">Corrective action</h2>
        <div class="srow"><span style="width:22px;text-align:center">🛠️</span>
        <div class="grow"><div class="t" style="font-size:13px">${ca.id} — ${ca.action}</div>
        <div class="s">${ca.owner} · due ${ca.due} · public disclosure ${pr.done}/${pr.total}${pr.done===pr.total?' ✓':''}</div></div></div>`;})()}`,
    (state.role==='eor'&&canAct())?`<button class="btn" id="ra_sign">✓ Review & sign off</button>`:'');
  const sg=$('#ra_sign'); if(sg)sg.onclick=()=>{
    r.reviewed='Today'; r.next='Aug 2029'; r.status='current';
    pushEvent('risk_reviewed',r.id+' reviewed & signed off by Engineer of Record — RPN '+rpn+' ('+band[1]+')');
    closeModal(); flash(r.id+' signed off — logged'); render();};
}
function newRiskAssessment(){
  const anchorOpts=(A)=>[...Array(10)].map((_,i)=>{const n=i+1;return `<option value="${n}">${n}${A[n]?' — '+A[n]:''}</option>`;}).join('');
  openModal('New failure-mode assessment',`
    <div class="banner info" style="margin-bottom:14px">Qualitative analysis + quantitative scores. Every rating carries an anchor so two engineers score the same way — and the assessment lands in the register as a ledger event.</div>
    ${field('Failure mode','<input id="ra_mode" class="inp" placeholder="e.g. Foundation failure">')}
    ${field('Mechanism (qualitative)','<textarea id="ra_mech" class="inp" rows="2" placeholder="How does this failure develop?"></textarea>')}
    ${field('Warning signs (qualitative)','<textarea id="ra_warn" class="inp" rows="2" placeholder="What would be seen first, and by which stream?"></textarea>')}
    <div class="grid g3" style="gap:10px">
      ${field('Severity (1–10)','<select id="ra_s" class="inp">'+anchorOpts(SEV_ANCHOR)+'</select>')}
      ${field('Occurrence (1–10)','<select id="ra_o" class="inp">'+anchorOpts(OCC_ANCHOR)+'</select>')}
      ${field('Detection (1–10)','<select id="ra_d" class="inp">'+anchorOpts(DET_ANCHOR)+'</select>')}
    </div>
    ${field('Owner','<select id="ra_own" class="inp"><option>T. Molefe</option><option>A. Naicker</option></select>')}`,
    `<button class="btn" id="ra_save">🎯 Add to register</button>`);
  $('#ra_save').onclick=()=>{
    const mode=$('#ra_mode').value.trim();
    if(!mode){flash('Name the failure mode');return;}
    const s=+$('#ra_s').value,o=+$('#ra_o').value,d=+$('#ra_d').value;
    riskRegister.push({id:'RA-0'+(raSeq++), mode, sev:s, occ:o, det:d, detWas:d, deps:[],
      owner:$('#ra_own').value, reviewed:'Today', next:'Aug 2029', status:'current',
      mechanism:$('#ra_mech').value.trim()||'—', warning:$('#ra_warn').value.trim()||'—',
      consequence:'—', why:{sev:'Scored at creation',occ:'Scored at creation',det:'Scored at creation'},
      controls:[['To be assigned — monitoring-adequacy check will flag if none','procedure','live']]});
    pushEvent('risk_assessed','Risk assessment added — '+mode+' (S'+s+' O'+o+' D'+d+', RPN '+(s*o*d)+')');
    closeModal(); flash(mode+' added to the register'); render();
  };
}

/* Satellite-measured breach run-out profile: facility+breach → depth-graded corridor →

function breachImpactSVG(W,H){
  W=W||1040;H=H||280; const padL=96,padR=30,padT=26,padB=48,maxKm=10, m=breachEvent.mag;
  const X=km=>padL+(km/maxKm)*(W-padL-padR), cy=(padT+(H-padB))/2, re=X(m.runoutKm);
  const corr=`${padL},${cy-14} ${X(1)},${cy-34} ${X(m.runoutKm*0.6)},${cy-46} ${re},${cy-22} ${re},${cy+22} ${X(m.runoutKm*0.6)},${cy+46} ${X(1)},${cy+34} ${padL},${cy+14}`;
  const recs=receptors.map(r=>{const x=X(r.distKm),hit=r.distKm<=m.runoutKm,c=hit?'#f87171':'#8aa0b2';
    return `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-padB}" stroke="#22384a" stroke-width="1" stroke-dasharray="2 3"/>
      ${hit?`<circle cx="${x.toFixed(1)}" cy="${cy}" r="11" fill="none" stroke="#f87171" stroke-width="1.5"/>`:''}
      <circle cx="${x.toFixed(1)}" cy="${cy}" r="${hit?6:5}" fill="${c}" stroke="#0b1620" stroke-width="1.5"/>
      <text x="${x.toFixed(1)}" y="${padT-5}" fill="${hit?'#fca5a5':'#7f93a5'}" font-size="9" text-anchor="middle">${hit?r.arrival:'beyond'}</text>
      <text x="${x.toFixed(1)}" y="${H-padB+14}" fill="#9fb3c6" font-size="9" text-anchor="middle">${r.distKm} km</text>
      <text x="${x.toFixed(1)}" y="${H-padB+26}" fill="#7f93a5" font-size="8" text-anchor="middle">${r.name.split(/[ ·]/)[0]}</text>`;}).join('');
  let ticks='';for(let k=0;k<=maxKm;k+=2){const x=X(k);ticks+=`<line x1="${x.toFixed(1)}" y1="${H-padB}" x2="${x.toFixed(1)}" y2="${H-padB+4}" stroke="#3a4a5a"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    <defs><linearGradient id="brg" x1="0" x2="1"><stop offset="0" stop-color="#7a5a34"/><stop offset="0.5" stop-color="#a8895a"/><stop offset="1" stop-color="#d8c39a"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="#0b1620"/>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#3a4a5a"/>${ticks}
    <polygon points="${corr}" fill="url(#brg)" opacity="0.92" stroke="#c9a97a" stroke-width="1"/>
    <text x="${X(m.runoutKm*0.5).toFixed(1)}" y="${cy+3}" fill="#241a0d" font-size="10" font-weight="700" text-anchor="middle">run-out · ${m.inundationHa} ha · peak ${m.peakDepthM} m</text>
    <ellipse cx="${padL-36}" cy="${cy}" rx="30" ry="35" fill="#37c2b81a" stroke="#37c2b8" stroke-width="2"/>
    <ellipse cx="${padL-32}" cy="${cy+13}" rx="12" ry="8" fill="#4aa3ff55" stroke="#cfe6ff"/>
    <path d="M${padL-8} ${cy-11} L${padL} ${cy} L${padL-8} ${cy+11}" fill="none" stroke="#f87171" stroke-width="3"/>
    <text x="${padL-36}" y="${cy-42}" fill="#7fb5f7" font-size="9" text-anchor="middle">TSF · breach ${m.breachWidth} m</text>
    ${recs}
    <text x="${re.toFixed(1)}" y="${cy-30}" fill="#fca5a5" font-size="9" text-anchor="middle">leading edge ${m.runoutKm} km</text>
    <text x="${W-padR}" y="${H-padB+14}" fill="#7f93a5" font-size="9" text-anchor="end">distance downstream →</text></svg>`;
}

  const f=n=>n>=1000?n.toLocaleString('en-US'):n;

  else {t.green='> '+f(t.gLim); t.amber=f(t.rLim)+'–'+f(t.gLim); t.red='< '+f(t.rLim);}
}

  setTimeout(()=>{const b=$('#svImp'); if(b)b.onclick=importSurvey;},0);

function importSurvey(){
  const rows=surveyCampaign.results.map(r=>{
    const d=gaugeDatums.find(g=>g.point===r.point);
    const over=Math.abs(r.drift)>d.tol;
    return `<div class="srow"><div class="grow"><div class="t" style="font-size:13px">${r.point}</div>
      <div class="s">${d.rl.toFixed(3)} → ${r.newRl.toFixed(3)} m RL · drift ${r.drift>0?'+':''}${r.drift} mm (tol ±${d.tol})</div></div>
      ${over?'<span class="pill red"><span class="dot"></span>Adjust datum</span>':'<span class="pill green"><span class="dot"></span>Verify</span>'}</div>`;
  }).join('');
  openModal('Import survey campaign',`
    <div class="banner info" style="margin-bottom:12px">🗺️ <b>${surveyCampaign.date}</b> · ${surveyCampaign.surveyor} · ${surveyCampaign.method}. In the real build this parses the level book / CSV; the result is the same — every board reconciled against its record.</div>
    ${rows}
    <div class="banner warn" style="margin-top:12px">Applying will <b>verify</b> in-tolerance boards and <b>adjust the datum</b> where drift exceeds tolerance — each an immutable ledger event. Readings before an adjustment keep their values with a correction note; nothing is rewritten.</div>`,
    `<button class="btn" id="sv_apply">⚖️ Apply campaign & log</button>`);
  $('#sv_apply').onclick=()=>{
    pushEvent('survey_imported','Survey campaign imported — '+surveyCampaign.date+' · '+surveyCampaign.method);
    surveyCampaign.results.forEach(r=>{
      const d=gaugeDatums.find(g=>g.point===r.point);
      const over=Math.abs(r.drift)>d.tol;
      d.lastSurvey='Today'; d.drift=r.drift;
      if(over){d.rl=r.newRl; d.status='adjusted';
        d.hist.push({when:'Today', rl:r.newRl, drift:r.drift, by:surveyCampaign.surveyor, note:'Drift beyond ±'+d.tol+' mm — datum adjusted'});
        pushEvent('datum_adjusted',d.point+' board settled '+(r.drift>0?'+':'')+r.drift+' mm — datum adjusted to '+r.newRl.toFixed(3)+' m RL; prior readings carry correction note');
      } else {d.status='verified';
        d.hist.push({when:'Today', rl:d.rl, drift:r.drift, by:surveyCampaign.surveyor, note:'Verified within tolerance'});}
    });
    closeModal(); flash('Campaign applied — 1 datum adjusted, 2 verified, all ledgered'); render();
  };
}

function schedEventDetail(e){

  if(e.status==='completed'){
    openModal('Completed — '+e.level+' · '+e.scope,`
      <div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <span class="pill green"><span class="dot"></span>Completed</span>
        ${e.fhi?'<span class="pill '+(e.fhi>=85?'green':'amber')+'">🩺 FHI '+e.fhi+'</span><span class="pill grey">AQI '+e.aqi+'</span>':'<span class="pill grey">not scored</span>'}
        ${e.flags?'<span class="pill amber"><span class="dot"></span>'+e.flags+' flagged</span>':''}</div>
      <div class="kv"><span class="k">Slot</span><span class="v">${when}</span></div>

      <div class="kv"><span class="k">Slot</span><span class="v">${when}</span></div>
      <div class="kv"><span class="k">Inspector</span><span class="v">${e.inspector}</span></div>
      <div class="banner crit" style="margin-top:12px">${e.note||'Escalated per M12.'} A missed slot is a ledger fact — adherence is the pilot metric, so it is never quietly rescheduled.</div>`,

    const foot=auto?'':(e.status==='planned'&&canAct())
      ? ((e.points&&e.points.length)?'<button class="btn sec" id="se_pts">🗺️ View route</button>':'')+'<button class="btn" id="se_now">💬 Dispatch now</button>'
      :'';

      <div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <span class="pill grey">${INSP_TYPES[ty].ic} ${INSP_TYPES[ty].label}</span>

        ${e.mode==='inspect'?'<span class="pill grey">Sensor health check</span>':''}</div>
      <div class="kv"><span class="k">Slot</span><span class="v">${when}</span></div>
      <div class="kv"><span class="k">${ty==='drone'?'Pilot':ty==='satellite'?'Source':'Assigned to'}</span><span class="v">${e.inspector}${wa?' <span class="mono tiny">(WhatsApp)</span>':''}</span></div>
      ${(e.points&&e.points.length)?'<div class="kv"><span class="k">Route points</span><span class="v">'+e.points.join(', ')+'</span></div>':''}

function scheduleInspection(){
  let type='manual', sMode='inspect', pts=[];
  const dayOpts=[...Array(31)].map((_,i)=>`<option ${i===2?'selected':''}>${i+1}</option>`).join('');
  const timeOpts='<option>03:10</option><option>06:00</option><option selected>07:00</option><option>09:00</option><option>14:00</option><option>16:00</option>';
  const scopeBox=()=>`<div class="fld"><label>Scope — inspection points (from the onboarding map)</label>
    <div class="row" style="gap:8px"><div class="inp" style="flex:1;min-height:40px;display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:8px 10px">${pts.length?pts.map(id=>'<span class="pill blue" style="padding:2px 8px">'+id+'</span>').join(''):'<span class="mute">Whole route — or pick specific points</span>'}</div>
    <button type="button" class="btn sec" id="si_map">🗺️ Points map</button></div></div>`;
  function fields(){
    if(type==='satellite') return `<div class="banner info" style="margin:0">🛰️ Satellite passes run on the fixed ~5-day Sentinel-2 cadence — nothing to book. The next two are already on the calendar; results auto-process into M05. Need eyes sooner? Schedule a drone or a manual round.</div>
      <div class="kv"><span class="k">Scope</span><span class="v">Full AOI · tile ${facility.location.tile}</span></div>`;
    if(type==='drone') return field('Mission type','<select id="si_dtype" class="inp"><option>Photogrammetry survey</option><option>Erosion follow-up</option><option>Crest &amp; wall video</option></select>')
      +field('Pilot','<select id="si_pilot" class="inp">'+droneAssets.pilots.map(p=>'<option>'+p.name+'</option>').join('')+'</select>')+scopeBox();
    if(type==='sensor') return `<div class="fld"><label>Sensor mode</label><div class="tabs" style="width:100%">
        <button type="button" class="smode ${sMode==='fixed'?'on':''}" data-m="fixed" style="flex:1">Fixed / continuous</button>
        <button type="button" class="smode ${sMode==='inspect'?'on':''}" data-m="inspect" style="flex:1">Inspect the sensor</button></div></div>`
      +(sMode==='fixed'
        ? `<div class="banner info" style="margin:0">📡 A fixed sensor streams continuously — there's nothing to schedule. Its health is watched automatically (device-health, M08) and you're alerted if it drops offline. Switch to <b>Inspect the sensor</b> to book a physical check of the instrument.</div>`
        : field('Sensor to inspect','<select id="si_sensor" class="inp">'+instruments.map(i=>'<option>'+i.id+' — '+i.type+' ('+i.loc+')</option>').join('')+'</select>')
          +`<div class="tiny mute" style="margin:-6px 0 10px">The monitoring system is itself an inspected object — check the instrument, its datum and its data quality on site.</div>`
          +field('Assigned to','<select id="si_who" class="inp">'+inspectors.map(i=>'<option>'+i.name+'</option>').join('')+'</select>'));
    return field('Level','<select id="si_l" class="inp"><option>Routine</option><option>Intermediate</option><option>Comprehensive</option><option>Special</option></select>')
      +field('Inspector','<select id="si_i" class="inp">'+inspectors.map(i=>'<option>'+i.name+'</option>').join('')+'</select>')+scopeBox();
  }
  function noWhen(){return type==='satellite'||(type==='sensor'&&sMode==='fixed');}
  function show(){
    openModal('Schedule surveillance',`
      <div class="banner info" style="margin-bottom:14px">Plan any surveillance type from here. People get a WhatsApp job card, drones a mission, sensors a health check — each flows out 2 h before its slot.</div>
      <div class="fld"><label>Inspection type</label>
        <div class="tabs" style="width:100%">${Object.keys(INSP_TYPES).map(t=>`<button type="button" class="stype ${type===t?'on':''}" data-t="${t}" style="flex:1">${INSP_TYPES[t].ic} ${INSP_TYPES[t].label}</button>`).join('')}</div>
        <div class="tiny mute" style="margin-top:6px">${INSP_TYPES[type].desc}</div></div>
      ${fields()}
      ${noWhen()?'':`<div class="grid g3" style="gap:10px;margin-top:2px">
        ${field('Month','<select id="si_m" class="inp"><option value="1" selected>August</option><option value="2">September</option></select>')}
        ${field('Day','<select id="si_d" class="inp">'+dayOpts+'</select>')}
        ${field('Time','<select id="si_t" class="inp">'+timeOpts+'</select>')}</div>`}`,
      noWhen()?`<button class="btn sec" id="si_close">Close</button>`:`<button class="btn" id="si_save">🗓️ Add to schedule</button>`);
    document.querySelectorAll('.stype').forEach(b=>b.onclick=()=>{type=b.dataset.t; show();});
    document.querySelectorAll('.smode').forEach(b=>b.onclick=()=>{sMode=b.dataset.m; show();});
    const mp=$('#si_map'); if(mp)mp.onclick=()=>inspectionPointsModal(s=>{pts=s; show();}, pts);
    const cl=$('#si_close'); if(cl)cl.onclick=closeModal;
    const sv=$('#si_save'); if(sv)sv.onclick=commit;
  }
  function commit(){
    const m=+$('#si_m').value, d=+$('#si_d').value, time=$('#si_t').value;
    const ev={m,d,time,status:'planned',type};
    if(type==='manual'){ev.level=$('#si_l').value; ev.inspector=$('#si_i').value; ev.points=pts.slice();
      ev.scope=pts.length?pts.length+' points':'Full round';}
    else if(type==='drone'){ev.level='Drone'; ev.inspector=$('#si_pilot').value; ev.scope=$('#si_dtype').value; ev.points=pts.slice();}
    else {ev.level='Sensor inspection'; ev.mode='inspect'; ev.inspector=$('#si_who').value; ev.scope=$('#si_sensor').value.split(' — ')[0];}
    schedEvents.push(ev);
    pushEvent('inspection_scheduled',INSP_TYPES[type].label+' surveillance scheduled — '+(ev.scope||ev.level)+' · Aug '+d+' '+time+' ('+ev.inspector+')');
    calMonth=m; closeModal(); flash('Scheduled — '+INSP_TYPES[type].label+' on the '+d+' at '+time); render();
  }
  show();
}

/* =========================== dam health questionnaire (closed-ended judgment) =========================== */
function fhiSparkSVG(){
  const d=healthHistory.map(x=>x.fhi), W=1040, H=110, pad=22, n=d.length, dx=n>1?(W-2*pad)/(n-1):0;
  const min=60,max=100, y=v=>H-pad-((v-min)/(max-min))*(H-2*pad);
  const line=d.map((v,i)=>`${i?'L':'M'}${(pad+i*dx).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="110" preserveAspectRatio="none">
    <line x1="${pad}" y1="${y(85).toFixed(1)}" x2="${W-pad}" y2="${y(85).toFixed(1)}" stroke="#1c5a3a" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="${pad}" y1="${y(70).toFixed(1)}" x2="${W-pad}" y2="${y(70).toFixed(1)}" stroke="#5a4713" stroke-width="1" stroke-dasharray="5 4"/>
    <path d="${line}" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
    ${d.map((v,i)=>`<circle cx="${(pad+i*dx).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="#2dd4bf"/>
      <text x="${(pad+i*dx).toFixed(1)}" y="${y(v)-9}" fill="#8ff0dc" font-size="11" text-anchor="middle" font-weight="700">${v}</text>`).join('')}
    <text x="${W-pad}" y="${y(85)-4}" fill="#4d8a6a" font-size="9" text-anchor="end">healthy ≥85</text>
    <text x="${W-pad}" y="${y(70)-4}" fill="#8a7a3d" font-size="9" text-anchor="end">watch <70</text>
  </svg>`;
}
function healthQuestionnaire(){
  let level='routine';
  const ans={}, aq={};
  function qsFor(){return HQ.filter(q=>HQ_LEVELS[level].includes(q.lvl));}
  function scores(){
    const qs=qsFor();
    const done=qs.every((q,i)=>ans[i]!==undefined), aqDone=AQ.every((a,i)=>aq[i]!==undefined);
    let fhi=null,aqi=null;
    if(done){const num=qs.reduce((s,q,i)=>s+ans[i]*q.w,0), den=qs.reduce((s,q)=>s+3*q.w,0);
      fhi=Math.round(100*(1-num/den));}
    if(aqDone) aqi=Math.round(100*(1-AQ.reduce((s,a,i)=>s+aq[i],0)/9));
    return {qs,done,aqDone,fhi,aqi};
  }
  function optBtn(prefix,qi,s,o,on){
    const style=on?('background:'+(s===0?'rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:#6ee7b7':s===3?'rgba(248,113,113,.16);border-color:rgba(248,113,113,.45);color:#fca5a5':'rgba(251,191,36,.16);border-color:rgba(251,191,36,.45);color:#fcd34d')):'';
    return `<button class="btn sec sm hqo ${on?'on':''}" data-p="${prefix}" data-q="${qi}" data-s="${s}" style="${style}">${s} · ${o}</button>`;
  }
  function qRow(item,qi,store,prefix){
    return `<div class="param" style="border-top:1px solid var(--line-2);padding:12px 0">
        <div class="pn" style="font-size:13.5px;font-weight:600;margin-bottom:2px">${item.q}</div>
        ${item.comp?`<div class="tiny mute" style="margin-bottom:8px">weight ×${item.w} · <span style="color:#7fb5f7">${item.comp}</span></div>`:'<div style="height:6px"></div>'}
        <div class="row" style="gap:6px;flex-wrap:wrap">${item.opts.map((o,s)=>optBtn(prefix,qi,s,o,store[qi]===s)).join('')}</div></div>`;
  }
  function modeSub(qs){ // per-mode {sub, done, n, m} keyed by mode id, over the current level's answered set
    const out={};
    HQ_MODES.forEach(md=>{
      const items=qs.map((q,i)=>({q,i})).filter(x=>x.q.mode===md.id);
      if(!items.length)return;
      const ansd=items.filter(x=>ans[x.i]!==undefined);
      let sub=null;
      if(ansd.length===items.length){const num=items.reduce((s,x)=>s+ans[x.i]*x.q.w,0),den=items.reduce((s,x)=>s+3*x.q.w,0);sub=Math.round(100*(1-num/den));}
      out[md.id]={sub,done:ansd.length===items.length,n:ansd.length,m:items.length,items};
    });
    return out;
  }
  function hqGrouped(qs){
    const subs=modeSub(qs);
    return HQ_MODES.map(md=>{
      const g=subs[md.id]; if(!g)return '';
      const pill=g.done
        ? `<span class="pill ${g.sub>=85?'green':g.sub>=70?'amber':'red'}"><span class="dot"></span>${g.sub}/100</span>`
        : `<span class="pill grey">${g.n}/${g.m} answered</span>`;
      return `<div style="margin-top:15px">
        <div class="row" style="justify-content:space-between;align-items:center;gap:8px;padding-bottom:2px">
          <div class="t" style="font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:#526277;font-weight:700">${md.ic} ${md.id} · ${md.name} <span class="mute" style="text-transform:none;font-weight:500">· severity ${md.sev}/10</span></div>
          ${pill}</div>
        ${g.items.map(x=>qRow(x.q,x.i,ans,'hq')).join('')}</div>`;
    }).join('');
  }
  function body(){
    const sc=scores();
    return `
      <div class="tabs" style="margin-bottom:4px">${['routine','intermediate','comprehensive'].map(l=>
        `<button class="hql ${level===l?'on':''}" data-l="${l}">${l[0].toUpperCase()+l.slice(1)} · ${HQ.filter(q=>HQ_LEVELS[l].includes(q.lvl)).length} q</button>`).join('')}</div>
      <div class="banner info" style="margin:2px 0 4px">Scored <b>against the credible failure modes</b> — each question is a specific warning sign the FMEA register watches. 0 is best, 3 is worst. Anything the instruments already measure — freeboard, pond distance, displacement rate, decant flow — is <b>deliberately left out</b>: this round captures only the visual judgment the objective streams can't, so it <b>builds on</b> the objective health instead of re-scoring it. Each mode shows its own sub-score, so you see which is dragging the index.</div>
      ${hqGrouped(sc.qs)}
      <h2 style="margin:20px 0 2px;color:#66809a;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase">Assessment quality — score the inspection itself</h2>
      ${AQ.map((item,qi)=>qRow(item,qi,aq,'aq')).join('')}
      <div class="banner ${sc.done&&sc.aqDone?(sc.fhi>=85?'info':'warn'):'info'}" style="margin-top:12px" id="hqLive">
        ${sc.done? '🩺 <b>FHI '+sc.fhi+'</b> / 100':'🩺 Answer all '+sc.qs.length+' questions — '+Object.keys(ans).filter(k=>k<sc.qs.length).length+' of '+sc.qs.length+' done'}
        ${sc.aqDone? ' · <b>AQI '+sc.aqi+'</b> ('+aqiWord(sc.aqi)[1]+')':' · assessment quality pending'}
      </div>`;
  }
  function show(){
    openModal('Dam health questionnaire — '+level,body(),
      `<button class="btn sec" id="hq_cancel">Cancel</button><button class="btn" id="hq_save">🩺 Submit score</button>`);
    document.querySelectorAll('.hql').forEach(b=>b.onclick=()=>{level=b.dataset.l;
      Object.keys(ans).forEach(k=>delete ans[k]); show();});
    document.querySelectorAll('.hqo').forEach(b=>b.onclick=()=>{
      (b.dataset.p==='hq'?ans:aq)[+b.dataset.q]=+b.dataset.s; show();});
    $('#hq_cancel').onclick=closeModal;
    $('#hq_save').onclick=()=>{
      const sc=scores();
      if(!sc.done||!sc.aqDone){flash('Answer every question — the index needs a complete set');return;}
      const subs=modeSub(sc.qs), modes={};
      Object.keys(subs).forEach(k=>{modes[k]=subs[k].sub;});
      const weakest=Object.keys(modes).reduce((a,b)=>modes[b]<modes[a]?b:a);
      const wName=(HQ_MODES.find(m=>m.id===weakest)||{}).name;
      const rec={date:'Today', insp:'—', level:level[0].toUpperCase()+level.slice(1), fhi:sc.fhi, aqi:sc.aqi, by:roleName[state.role], modes};
      healthHistory.push(rec);
      pushEvent('health_scored','Health scored — '+rec.level+' FHI '+sc.fhi+' · AQI '+sc.aqi+' ('+aqiWord(sc.aqi)[1]+') · weakest mode '+weakest+' '+modes[weakest]+' ('+wName+')');
      if(modes[weakest]<70) pushEvent('alert_raised','Failure mode below watch level — '+weakest+' '+wName+' at '+modes[weakest]+'/100');
      if(sc.fhi<70) pushEvent('alert_raised','Health index below watch level — FHI '+sc.fhi+' on '+rec.level+' round');
      if(sc.aqi<67) pushEvent('alert_raised','Low-confidence assessment — AQI '+sc.aqi+', re-inspection flagged');
      closeModal(); flash('Scored — FHI '+sc.fhi+' ('+aqiWord(sc.aqi)[1]+')'); render();
    };
  }
  show();
}

function dbCompleteness(){
  const req=[facility.name,facility.operator,facility.construction,facility.storage,facility.consequence,
    facility.phase,facility.commissioned,facility.location&&facility.location.lat,facility.location&&facility.location.lng,
    ...freeboardStack.map(f=>f.m),design.fos,design.beach_slope,design.design_storm,design.review_date,
    facility.roles.re,facility.roles.eor,facility.roles.sheq];
  const filled=req.filter(x=>x!==''&&x!==null&&x!==undefined).length;
  const docs=designDocs.filter(d=>d.status==='on_file').length;
  return {pct:Math.round((filled+docs)/(req.length+designDocs.length)*100),
    missingDocs:designDocs.length-docs, filled, total:req.length+designDocs.length};
}

function saveDesignBasis(){
  const gv=id=>{const e=$('#'+id);return e?e.value.trim():null;};
  const pend=[];
  const stage=(label,cur,nv,set)=>{if(nv!==null&&nv!==''&&String(nv)!==String(cur))pend.push({label,cur,nv,set});};
  stage('Facility name',facility.name,gv('db_name'),x=>facility.name=x);
  stage('Operator',facility.operator,gv('db_op'),x=>facility.operator=x);
  stage('Lifecycle phase',facility.phase,gv('db_phase'),x=>facility.phase=x);
  stage('Commissioned',facility.commissioned,gv('db_comm'),x=>facility.commissioned=x);
  stage('Construction method',facility.construction,gv('db_cm'),x=>facility.construction=x);
  stage('Storage method',facility.storage,gv('db_sm'),x=>facility.storage=x);
  stage('Consequence class',facility.consequence,gv('db_cc'),x=>facility.consequence=x);
  stage('Latitude',facility.location.lat,gv('db_lat'),x=>facility.location.lat=parseFloat(x)||facility.location.lat);
  stage('Longitude',facility.location.lng,gv('db_lng'),x=>facility.location.lng=parseFloat(x)||facility.location.lng);
  freeboardStack.forEach((s,i)=>stage(s.name,s.m.toFixed(2),gv('fb_'+i),x=>s.m=parseFloat(x)||s.m));
  stage('Target FoS',design.fos,gv('db_fos'),x=>design.fos=x);
  stage('Design beach slope',design.beach_slope,gv('db_slope'),x=>design.beach_slope=x);
  stage('Design storm',design.design_storm,gv('db_storm'),x=>design.design_storm=x);
  stage('Design-storm review date',design.review_date,gv('db_review'),x=>design.review_date=x);
  stage('Responsible Executive',facility.roles.re,gv('db_re'),x=>facility.roles.re=x);
  stage('Engineer of Record',facility.roles.eor,gv('db_eor'),x=>facility.roles.eor=x);
  stage('SHEQ manager',facility.roles.sheq,gv('db_sheq'),x=>facility.roles.sheq=x);
  if(!pend.length){flash('No changes to save');return;}
  openModal('Confirm design basis changes',`
    <div class="banner warn" style="margin-bottom:14px">A design criterion change is an immutable ledger event — it needs a justification, and the prior values stay on record.</div>
    ${pend.map(p=>`<div class="kv"><span class="k">${p.label}</span><span class="v"><span class="mute">${p.cur}</span> → <b>${p.nv}</b></span></div>`).join('')}
    <div class="fld" style="margin-top:14px"><label>Justification (required)</label>
    <textarea id="db_just" class="inp" rows="2" placeholder="e.g. Updated from Design Basis Report rev C, March 2026"></textarea></div>`,
    `<button class="btn sec" id="db_cancel">Cancel</button><button class="btn" id="db_apply">✓ Apply ${pend.length} change${pend.length>1?'s':''} & log</button>`);
  $('#db_cancel').onclick=closeModal;
  $('#db_apply').onclick=()=>{
    const just=$('#db_just').value.trim();
    if(!just){flash('A justification is required');return;}
    pend.forEach(p=>p.set(p.nv));
    pushEvent('design_criterion_modified','Design basis updated — '+pend.map(p=>p.label).join(', ')+' · why: '+just);
    closeModal(); flash(pend.length+' change(s) saved & logged'); render();
  };
}

/* Each item derives its status from LIVE platform data — as data is entered
   (facility onboarding, inspectors, rounds, ledger events) items flip automatically. */
function complianceChecks(){
  const ev=t=>ledger.filter(e=>e.type===t).length;
  const offline=telemetry.filter(t=>t.status!=='live');
  const overdue=schedule.filter(s=>s.status==='overdue').length;

  const openJC=jobCards.filter(j=>j.status!=='completed').length, odJC=jobCards.filter(j=>j.overdue).length;
  const y=(evi)=>({ok:'yes',evi}), p=(evi)=>({ok:'partial',evi}), n=(evi)=>({ok:'no',evi});
  return [
    {sec:'A · Facility & design basis', items:[
      {req:'Facility classified — construction method, storage method, consequence class', src:'GISTM III · [T19]',
       r: facility.construction&&facility.storage&&facility.consequence ? y(`${facility.construction} · ${facility.storage} · ${facility.consequence} consequence — gates which analytics apply`) : n('Classify the facility in the registry')},
      {req:'Freeboard held as a stack of allowances, with a lower bound', src:'ANCOLD via [Z24]',
       r: freeboardStack.length>=5 ? y(`${freeboardStack.length} allowances seeded incl. minimum decant (lower bound)`) : n('Seed the freeboard stack from the design basis')},
      {req:'Location & satellite AOI defined (centroid + calculation boundary)', src:'[O22] · M05',
       r: facility.location ? y(`Centroid ${facility.location.lat.toFixed(4)}, ${facility.location.lng.toFixed(4)} · tile ${facility.location.tile}`) : n('Capture coordinates in onboarding')},
      {req:'Accountable roles named — Responsible Executive, Engineer of Record, SHEQ', src:'GISTM IV',
       r: facility.roles.re&&facility.roles.eor&&facility.roles.sheq ? y(`${facility.roles.re} · ${facility.roles.eor} · ${facility.roles.sheq}`) : n('Assign the three accountable roles')},
      {req:'Instrument inventory with position history', src:'[T19] · [D21]',
       r: instruments.length ? (instruments.some(i=>i.moved) ? y(`${instruments.length} instruments · relocation history on ${instruments.filter(i=>i.moved).length}`) : p(`${instruments.length} instruments, no relocation history yet`)) : n('Load the instrument inventory')},
      {req:'Design basis documents on file', src:'GISTM II · III',
       r: (()=>{const on=designDocs.filter(d=>d.status==='on_file').length;
          return on===designDocs.length ? y(`All ${on} documents on file`)
            : on ? p(`${on}/${designDocs.length} on file — missing: ${designDocs.filter(d=>d.status==='missing').map(d=>d.name).join(', ')}`)
            : n('No design basis documents filed yet');})()},
      {req:'Construction vs design intent verified per raise (CDIV)', src:'GISTM III',
       r: (()=>{const ver=raises.filter(r=>r.status==='verified').length;
          return ver ? y(`${ver} raises verified — as-built survey + EoR sign-off; Raise 5 in design (DBR rev D)`) : n('No raise records');})()},
    ]},
    {sec:'B · Surveillance & monitoring', items:[
      {req:'Inspection plan indexed to consequence class (five levels)', src:'ANCOLD · ICOLD B158',
       r: inspectionPlan.length>=4 ? y(`${inspectionPlan.length} levels — routine weekly per ICOLD B158 default`) : n('Define the inspection plan')},
      {req:'Routine inspection cadence being met', src:'ICOLD B158 · pilot metric',
       r: overdue===0 ? y('No overdue rounds · 75% weekly adherence') : p(`${overdue} round overdue · 75% adherence (baseline 48%)`)},
      {req:'Every credible failure mode has at least one live monitoring source', src:'[L19] P3 · M14',
       r: modesCovered===coverage.length ? y(`${modesCovered}/${coverage.length} failure modes covered across 4 streams`) : p(`${modesCovered}/${coverage.length} covered — gaps are red findings`)},
      {req:'Monitoring system itself is inspected — device health tracked', src:'[Z24] · M08',
       r: offline.length===0 ? y('All devices reporting') : p(`${offline.length} device offline (${offline.map(d=>d.id).join(', ')}) — coverage reduced, Detection re-scored`)},
      {req:'Site-specific thresholds calibrated, derivation recorded as audit evidence', src:'[O22] · P4',
       r: y('NDWI 0.11 / NIR 870 · 12-month transect · 2 VHR validation scenes · ±20,000 m² residual')},
      {req:'Uncertainty published with every analytic figure', src:'[T19] · [O22] · P5',
       r: ev('analytic_published') ? y('Pond area published with ± band; over-error scenes withheld, not published') : n('No analytic published yet')},
      {req:'Freeboard independently verified by field measurement', src:'ANCOLD · M03b',
       r: (()=>{const fr=fieldReadings.find(x=>x.type==='Freeboard');
          return fr ? y(`Latest ${fr.value.toFixed(2)} m (${fr.by}, ${fr.when}) — agrees with satellite within uncertainty`)
                    : n('No field freeboard reading on record');})()},
      {req:'Instrument calibration current — output itself reviewed', src:'[T19] · ISO 14001',
       r: (()=>{const od=instruments.filter(i=>i.calibOver);
          return od.length ? p(`${od.map(i=>i.id).join(', ')} calibration overdue — readings carry reduced confidence until recalibrated`)
                           : y(`All ${instruments.length} instruments in calibration date`);})()},
      {req:'Site-specific TARP triggers on every live observable, bound to actions and owners', src:'MAC · [L19] · P4',
       r: (()=>{const amb=tarps.filter(t=>evalTarp(t)[0]!=='green');
          return tarps.length ? y(`${tarps.length} observables under TARP across 4 streams · ${amb.length} currently amber with cross-checks running · derivations on record`)
                              : n('No TARP triggers set');})()},
      {req:'Breach analysis current — impacted area, arrival times, 5-yearly refresh', src:'GISTM II',
       r: y(`Study ${breachStudy.date} (${breachStudy.by}) · ${receptors.length} receptors with arrival times · refresh ${breachStudy.next} or at Raise 5`)},
    ]},
    {sec:'C · Field capture integrity', items:[
      {req:'Inspector identity recorded; WhatsApp opt-in captured', src:'M03b · POPIA',
       r: inspectors.length ? (invited ? p(`${inspectors.length} inspectors · ${invited} awaiting opt-in reply`) : y(`${inspectors.length} inspectors active, opt-in on file`)) : n('Add inspectors')},
      {req:'Photos geotagged + timestamped with chain of custody', src:'M03b',
       r: ev('photo_captured') ? y(`${ev('photo_captured')} photo event(s) — GPS + time + originating message retained`) : n('No photos captured yet')},
      {req:'No silent edits — amendments reference the original', src:'M03b · M14',

      {req:'One-action escalation to a named Engineer of Record, logged', src:'GISTM IV · M12',
       r: ev('escalation') ? y(`${ev('escalation')} escalation(s) to ${facility.roles.eor}`) : p('No escalations yet — route configured')},

       r: odJC ? p(`${openJC} open job card(s), ${odJC} overdue — reminder automation running`) : (openJC ? p(`${openJC} open job card(s), none overdue`) : y('All job cards closed'))},
      {req:'FMEA baseline captured — pre-deployment Detection scores', src:'M17 · spec §9',

            : y(`${riskRegister.length} failure modes assessed, reviews current, baseline Detection on record`);})()},
      {req:'EPRP filed and drilled on its defined test frequency', src:'GISTM V',
       r: (()=>{const f=eprpDoc().status==='on_file', d=drills.some(x=>x.status==='due');

      {req:'Independent reviews scheduled, findings tracked, dates published', src:'GISTM IV · VI',

                   : y('3 review streams current · no open findings · dates in the Topic VI pack');})()},

       r: reports.filter(r=>r.auto).length ? y(`${reports.filter(r=>r.auto).length} automated report templates live`) : n('Configure report schedules')},
      {req:'GISTM Topic VI public disclosure pack produced on cadence', src:'GISTM VI',
       r: y('Quarterly pack · last 30 Jun')},
      {req:'Point-in-time regulator evidence pack exportable', src:'M14',
       r: ev('report_generated') ? y(`Generated ${ev('report_generated')}× — each records the chain head it was built from`) : p('Available — not yet generated this period')},
      {req:'Corrective actions publicly disclosed — Topic VI checklist per failure mode', src:'GISTM VI · M13',
       r: (()=>{const full=correctiveActions.filter(c=>discProgress(c).done===DISC_STEPS.length);

            : started.length ? p(`${full.length}/${correctiveActions.length} fully disclosed (${full.map(c=>c.id).join(', ')||'none'}) · ${started.length-full.length} in progress — every step ledgered`)
            : n('No disclosure steps completed yet');})()},

                          : y(`${grievances.length} grievances logged, resolved and closure-documented`);})()},
    ]},
  ];
}

/* =========================== compliance & automated reporting =========================== */
function renderCompliance(){
  const v=$('#view'); v.innerHTML='';
  v.appendChild(h(`<div class="banner info">📋 <b>Compliance is generated, not compiled.</b> Every report below is assembled automatically from the evidence ledger and the four monitoring streams — the audit trail writes the report, no one retypes anything. GISTM Topic III is effectively this platform's specification.</div>`));

  // --- auto-evaluated compliance checklist ---
  const secs=complianceChecks();
  const flat=secs.flatMap(s=>s.items);
  const score=flat.reduce((a,i)=>a+(i.r.ok==='yes'?1:i.r.ok==='partial'?0.5:0),0);
  const pct=Math.round(score/flat.length*100);
  const nYes=flat.filter(i=>i.r.ok==='yes').length, nPart=flat.filter(i=>i.r.ok==='partial').length, nNo=flat.filter(i=>i.r.ok==='no').length;

      <span class="pill ${pct>=85?'green':pct>=60?'amber':'red'}"><span class="dot"></span>${flat.length} controls</span></div>
    <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
    <div class="tiny mute" style="margin-top:9px">Derived from the journal corpus — GISTM, ICOLD B158, ANCOLD, SANS 10286, [O22] [T19] [L19] [D21] [Z24]. Nothing here is typed in: each control re-evaluates against live registry, inspection, telemetry and ledger data, so the checklist fills itself in as data arrives.</div></div>`);
  v.appendChild(hero);
  const ckPill=o=>({yes:'<span class="pill green"><span class="dot"></span>Met</span>',partial:'<span class="pill amber"><span class="dot"></span>Partial</span>',no:'<span class="pill red"><span class="dot"></span>Outstanding</span>'}[o]);
