      <span class="tag2" style="white-space:nowrap;padding-top:4px">${i.src}</span></div>`)));
    v.appendChild(card);
  });

  // GISTM scorecard — topics I, II and V are now COMPUTED from module state (proactive)
  const _ep=eprpDoc().status==='on_file';
  const _gOpen=grievances.filter(g=>g.status!=='resolved');
  gistm[0].status=_gOpen.length?'partial':'on_track';
  gistm[0].note='Stakeholder register + grievance log live — '+(_gOpen.length?_gOpen.map(g=>g.id).join(', ')+' open':'all grievances resolved');
  gistm[1].status='on_track';
  gistm[1].note='Registry + design basis + breach study (Nov 2024 · refresh Nov 2029 or at Raise 5)';
  gistm[4].status=_ep?(drills.some(d=>d.status==='due')?'partial':'on_track'):'gap';
  gistm[4].note=_ep?'EPRP filed · cascade + drill schedule live in the Emergency module':'EPRP not filed — file it in the Emergency module';
  const sc=h(`<div class="card mb" style="padding:16px 18px 6px"><h2>GISTM conformance scorecard</h2>
    <div class="tiny mute" style="margin:2px 0 8px">Six topics, mapped against what the platform can evidence today.</div>
    <table><thead><tr><th style="width:44px">Topic</th><th>Area</th><th>Status</th><th>Basis</th></tr></thead><tbody></tbody></table></div>`);
  const gp=s=>({on_track:'<span class="pill green"><span class="dot"></span>On track</span>',partial:'<span class="pill amber"><span class="dot"></span>Partial</span>',gap:'<span class="pill red"><span class="dot"></span>Gap</span>'}[s]);
  gistm.forEach(g=>sc.querySelector('tbody').appendChild(h(`<tr><td class="mono">${g.t}</td><td style="font-weight:600">${g.name}</td><td>${gp(g.status)}</td><td class="muted" style="font-size:12px">${g.note}</td></tr>`)));
  v.appendChild(sc);

  const cols=h(`<div class="grid g23"></div>`);
  // automated reports
  const rp=h(`<div class="card"><h2>Automated reports (M16)</h2>
    <div class="tiny mute" style="margin:2px 0 6px">Scheduled generation; every issue is a ledger event with the hash-chain head it was built from.</div></div>`);
  reports.forEach(r=>{
    const row=h(`<div class="srow"><span style="font-size:16px;width:22px;text-align:center">📄</span>
      <div class="grow"><div class="t" style="font-size:13.5px">${r.name}</div>

      ${r.auto?'<span class="pill green" style="margin-right:8px"><span class="dot"></span>auto</span>':'<span class="pill grey" style="margin-right:8px">on demand</span>'}
      ${canAct()?'<button class="btn sec sm">Generate now</button>':''}</div>`);
    const b=row.querySelector('button');
    if(b)b.onclick=()=>{pushEvent('report_generated',r.name+' generated — assembled from ledger head #'+ledger[0].hash.slice(0,8));
      flash(r.name+' generated & logged');};
    rp.appendChild(row);

  cols.appendChild(rp);
  // standards register
  const st=h(`<div class="card"><h2>Standards register</h2>
    <div class="tiny mute" style="margin:2px 0 6px">The instruments this facility answers to, and where each binds the platform.</div></div>`);
  standardsReg.forEach(([n,role,statex])=>st.appendChild(h(`<div class="srow"><div class="grow"><div class="t" style="font-size:13px">${n}</div><div class="s">${role}</div></div><span class="pill blue">${statex}</span></div>`)));

/* =========================== job cards (M13) + WhatsApp automation =========================== */
const JC_PRIO={routine:['grey','Routine'],elevated:['amber','Elevated'],urgent:['red','Urgent']};
const JC_STATUS={dispatched:['blue','Dispatched'],reminded:['amber','Reminder sent'],in_progress:['amber','In progress'],completed:['green','Completed']};
function jcSourceLabel(s){return s==='alert'?'Alert follow-up (CAPA)':s==='adhoc'?'Ad-hoc task':'Scheduled round';}
function renderJobCards(){
  const v=$('#view'); v.innerHTML='';
  v.appendChild(h(`<div class="banner info">🪪 <b>Job cards are dispatched inspection tasks (work orders — M13).</b> Issue one here and it is sent to the assigned inspector over WhatsApp. The bot then automates the reminders and receives the photo reply — status flows back to this board and to the evidence ledger.</div>`));
  if(canAct()){const b=h(`<button class="btn" style="margin-bottom:16px">🪪 Issue job card</button>`); b.onclick=()=>issueJobCard(); v.appendChild(b);}
  const board=h(`<div class="kanban"></div>`);
  JC_COLS.forEach(([k,label])=>{
    const list=jobCards.filter(j=>j.status===k);
    const col=h(`<div class="kcol"><h4>${label}<span class="n">${list.length}</span></h4></div>`);
    list.forEach(j=>{
      const pr=JC_PRIO[j.priority];
      const card=h(`<div class="kcard ${j.overdue?'od':''}">
        <div class="row" style="justify-content:space-between"><span class="mono tiny">${j.id}</span><span class="pill ${pr[0]}" style="padding:1px 7px">${pr[1]}</span></div>
        <div class="sc">${j.scope}</div>
        <div class="mt">👤 ${j.inspector}</div>
        <div class="mt">📅 ${j.due}${j.overdue?' · <span style="color:#ff9a9a">overdue</span>':''}</div>
        <div class="row" style="justify-content:space-between;margin-top:9px"><span class="tag2">${j.source==='alert'?'Alert follow-up':j.source==='adhoc'?'Ad-hoc':'Scheduled'}</span><span class="tiny" style="color:#37c2b8">💬 WhatsApp</span></div>
      </div>`);
      card.onclick=()=>openJobCard(j); col.appendChild(card);
    });
    if(!list.length) col.appendChild(h(`<div class="tiny mute" style="padding:8px 4px">—</div>`));
    board.appendChild(col);
  });
  v.appendChild(board);
}
function refreshJC(jc){ if(state.view==='jobcards') render(); openJobCard(jc); }
function openJobCard(jc){
  const st=JC_STATUS[jc.status], pr=JC_PRIO[jc.priority];
  const thread=jc.thread.map(m=>bubble(m).outerHTML).join('');
  let foot='';
  if(canAct()){
    if(jc.status!=='completed'){
      foot+=`<button class="btn sec" id="jc_rem">⏰ Send reminder</button>`;
      foot+=`<button class="btn sec" id="jc_reply">📷 Simulate inspector reply</button>`;
    }
    if(jc.status==='in_progress') foot+=`<button class="btn" id="jc_done">✓ Mark received & close</button>`;
  }
  openModal('Job card '+jc.id,`
    <div class="row" style="gap:8px;margin-bottom:12px"><span class="pill ${st[0]}"><span class="dot"></span>${st[1]}</span>
      <span class="pill ${pr[0]}">${pr[1]}</span>${jc.overdue?'<span class="pill red"><span class="dot"></span>Overdue</span>':''}</div>
    <div class="kv"><span class="k">Scope</span><span class="v">${jc.scope}</span></div>
    <div class="kv"><span class="k">Assigned inspector</span><span class="v">${jc.inspector} · <span class="mono">${jc.whatsapp}</span></span></div>
    <div class="kv"><span class="k">Due</span><span class="v">${jc.due}</span></div>
    <div class="kv"><span class="k">Source</span><span class="v">${jcSourceLabel(jc.source)}</span></div>
    <h2 style="margin:16px 0 6px">WhatsApp thread</h2>
    <div style="background:#0b141a;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:280px;overflow-y:auto">${thread}</div>
    ${jc.status==='completed'
      ? '<div class="banner info" style="margin-top:12px">Round received and closed — captured to the evidence ledger.</div>'
      : '<div class="banner info" style="margin-top:12px">The bot automation sends a reminder before due, nudges + escalates when overdue, ingests the inspector’s photo reply, then closes the card.</div>'}
  `, foot);
  const rem=$('#jc_rem'); if(rem)rem.onclick=()=>{
    jc.thread.push({dir:'out',rem:true,text:"⏰ Reminder: job card "+jc.id+" ("+jc.scope+") is due "+jc.due+". Reply *START* or send your photos."});
    if(jc.status==='dispatched') jc.status='reminded';
    pushEvent('job_reminder','Reminder sent — '+jc.id+' to '+jc.inspector+' (WhatsApp)'); refreshJC(jc);};
  const rep=$('#jc_reply'); if(rep)rep.onclick=()=>{
    jc.thread.push({dir:'in',photo:true,text:"Photos from the round — attached"});
    jc.thread.push({dir:'out',text:"📍 Received "+jc.thread.filter(m=>m.photo).length+" photo(s), GPS + time tagged. Reviewing…"});
    jc.status='in_progress';
    pushEvent('inspection_received','Inspector reply received — '+jc.id+' ('+jc.inspector+', photo via WhatsApp)'); refreshJC(jc);};
  const dn=$('#jc_done'); if(dn)dn.onclick=()=>{
    jc.thread.push({dir:'out',text:"✓ Round received. Job card "+jc.id+" completed and logged. Thank you."});
    jc.status='completed'; jc.overdue=false;
    pushEvent('job_card_completed','Job card completed — '+jc.id+' ('+jc.scope+')'); refreshJC(jc);};
}
function issueJobCard(prefill){
  prefill=prefill||{};
  const inspOpts=inspectors.map(i=>`<option>${i.name}</option>`).join('');
  const sel=(arr,cur)=>arr.map(o=>`<option ${o[0]===cur?'selected':''} value="${o[0]}">${o[1]}</option>`).join('');
  const TYPES=[['schedule','Scheduled round'],['alert','Alert follow-up (CAPA)'],['adhoc','Ad-hoc task']];
  // Calendar date + time — the inspector's due day is picked on a real calendar, not a fixed list.
  const _p2=n=>String(n).padStart(2,'0');
  const _now=new Date();
  const todayISO=_now.getFullYear()+'-'+_p2(_now.getMonth()+1)+'-'+_p2(_now.getDate());
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const TIMES=['06:00','07:00','08:00','09:00','10:00','12:00','14:00','16:00','18:00'];
  const timeOpts=TIMES.map(t=>`<option ${t==='16:00'?'selected':''}>${t}</option>`).join('');
  const fmtDue=()=>{
    const d=$('#jc_duedate'), t=$('#jc_duetime');
    const iso=(d&&d.value)||todayISO, tm=(t&&t.value)||'16:00';
    const dt=new Date(iso+'T00:00:00');
    const rel=iso===todayISO?' (today)':'';
    return dt.getDate()+' '+MON[dt.getMonth()]+' · '+tm+rel;
  };
  function build(){
    const scope=($('#jc_scope')?$('#jc_scope').value:(prefill.scope||'Routine — East wall round'))||'Inspection task';
    const insp=$('#jc_insp')?$('#jc_insp').value:(inspectors[0]||{}).name;
    const due=fmtDue();
    const note=$('#jc_note')?$('#jc_note').value.trim():'';
    return `🪪 *Job card ${'JC-'+jcSeq}*\n${scope}\nAssigned to ${insp}. Due ${due}.${note?'\n'+note:''}\nReply *START* to begin, or send photos per point.`;
  }
  openModal('Issue job card',`
    <div class="banner info" style="margin-bottom:14px">Issuing a job card dispatches it to the inspector over WhatsApp and starts the reminder automation. Every step is logged to the evidence ledger.</div>
    ${field('Type','<select id="jc_type" class="inp">'+sel(TYPES,prefill.source||'schedule')+'</select>')}
    ${field('Scope / task','<input id="jc_scope" class="inp" value="'+(prefill.scope||'Routine — East wall round')+'">')}
    ${field('Assign to inspector','<select id="jc_insp" class="inp">'+inspOpts+'</select>')}
    <div class="grid g3" style="gap:10px">
      ${field('Due date','<input id="jc_duedate" type="date" class="inp" value="'+todayISO+'" min="'+todayISO+'">')}
      ${field('Due time','<select id="jc_duetime" class="inp">'+timeOpts+'</select>')}
      ${field('Priority','<select id="jc_prio" class="inp">'+sel([['routine','Routine'],['elevated','Elevated'],['urgent','Urgent']],prefill.priority||'routine')+'</select>')}
    </div>
    ${field('Instructions (sent in the message)','<textarea id="jc_note" class="inp" rows="2" placeholder="Optional — e.g. focus on the west wall toe seepage">'+(prefill.note||'')+'</textarea>')}
    <div class="fld"><label>Reminder automation</label>
      <div style="background:#0a1826;border:1px solid var(--line);border-radius:9px;padding:11px;font-size:12px;color:var(--ink-dim);line-height:1.9">
        ⏰ Reminder 2 h before due · 🔴 Overdue nudge + escalate to SHEQ · 📷 Auto-receive photo reply · ✅ Close on completion</div></div>
    <div class="fld"><label>WhatsApp message preview</label>
      <div id="jc_prev" style="background:#0a5c50;color:#eafff2;border:1px solid #0a7d6f;border-radius:12px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap;line-height:1.5">${build()}</div></div>

/* ============ Phase 2 roadmap — the module-activation framework ============ */
function p2Summary(){
  const gaps=new Set(); PHASE2.forEach(p=>p.fills.forEach(f=>gaps.add(f[0]+'|'+f[1])));
  const gates=PHASE2.reduce((a,p)=>a+p.gate.length,0);
  const met=PHASE2.reduce((a,p)=>a+p.gate.filter(g=>g[2]).length,0);
  return {mods:PHASE2.length, gaps:gaps.size, gates, met,
    ready:PHASE2.filter(p=>!p.activated && p.gate.every(g=>g[2])).length,
    activated:PHASE2.filter(p=>p.activated).length};
}
function p2GateRow(p,gi){
  const g=p.gate[gi];
  return `<div class="p2gate ${g[2]?'on':''}" data-mod="${p.id}" data-gi="${gi}">
    <span class="p2box">${g[2]?'✓':''}</span>
    <div class="grow"><div class="t" style="font-size:12.6px;color:#26333f">${g[0]}</div><div class="s tiny mute">${g[1]}</div></div></div>`;
}
function p2Card(p){
  const st=P2_STATUS[p.status], met=p.gate.filter(g=>g[2]).length, tot=p.gate.length;
  const ready=met===tot, pct=Math.round(100*met/tot);
  const fills=p.fills.length?p.fills.map(f=>`<span class="tag2">${f[0]} · ${({sat:'🛰️ Satellite',drone:'🚁 Drone',iot:'📡 IoT',model:'📈 Model',platform:'🗂️ Platform',assurance:'🤖 Assurance'}[f[1]]||f[1])}</span>`).join(' '):'<span class="tag2">Cross-cutting — no single coverage cell</span>';
  const statusPill=p.activated?'<span class="pill green"><span class="dot"></span>Activated</span>'
    :ready?'<span class="pill blue"><span class="dot"></span>Gate met — ready</span>'
    :`<span class="pill ${st[0]}"><span class="dot"></span>${st[1]}</span>`;
  return `<div class="card mb p2mod" data-mod="${p.id}" style="scroll-margin-top:80px">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px">
      <div><h2 style="margin:0">${p.icon} ${p.id} · ${p.name}</h2>
        <div class="tiny mute" style="margin-top:3px;max-width:640px">${p.unlocks}</div></div>
      <div class="row" style="gap:6px">${statusPill}<span class="tag2">effort ${({S:'Small',M:'Medium',L:'Large'}[p.effort])}</span></div></div>
    <div style="margin:12px 0 2px">${fills}</div>
    <div class="grid g2" style="gap:10px;margin-top:10px">
      <div class="tiny"><span class="mute" style="font-weight:600">Data source</span><br>${p.source}</div>
      <div class="tiny"><span class="mute" style="font-weight:600">Depends on</span><br>${p.depends.join(' · ')}</div></div>
    <div class="row" style="justify-content:space-between;margin:14px 0 4px">
      <div class="tiny mute" style="font-weight:600;color:#26333f">Activation gate — all must pass before this module goes live</div>
      <div class="tiny mute">${met} / ${tot} met</div></div>
    <div class="p2bar"><div style="width:${pct}%"></div></div>
    <div style="margin-top:8px">${p.gate.map((g,i)=>p2GateRow(p,i)).join('')}</div>
    <div style="margin-top:12px" class="p2act">${
      p.activated?'<span class="tiny mute">✓ Live in Phase 2 — feeds its coverage cell and the fusion check.</span>'
      :`<button class="btn ${ready&&canAct()?'':'sec'}" data-act="${p.id}" ${ready&&canAct()?'':'disabled'} style="${ready&&canAct()?'':'opacity:.5;cursor:not-allowed'}">Activate ${p.id}${ready?'':' — gate not met'}</button>`
    }</div></div>`;
}
function renderRoadmap(){
  const v=$('#view'); v.innerHTML='';
  v.appendChild(h(`<div class="banner info">🧭 <b>Phase 2 is a framework, not a promise.</b> Phase 1 ships four modules — M01 registry, M03b manual/WhatsApp, M05 optical, M14 ledger. Every other analytic is a defined <b>slot</b> below: what coverage gap it closes, the data source it plugs into, and an <b>activation gate</b> that must go green before it can turn on. A module is never enabled by decision — it is enabled when its gate is met. This is what the backend team builds against.</div>`));
  const s=p2Summary();
  const hero=h(`<div class="card hero mb"><div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><h2>Phase 2 module framework</h2>
      <h3 style="margin:4px 0 0">${s.mods} modules · ${s.gaps} coverage gaps addressed · ${s.activated} live · ${s.ready} ready to activate</h3></div>
      <span class="pill ${s.activated?'green':'grey'}"><span class="dot"></span>${s.met} / ${s.gates} gate items met</span></div>
    <div class="grid g3" style="margin-top:14px">
      <div class="stat" style="box-shadow:none"><div class="lab">Phase 1 (live now)</div><div class="num">4</div><div class="sub">M01 · M03b · M05 · M14</div></div>
      <div class="stat blue" style="box-shadow:none"><div class="lab">Phase 2 slots</div><div class="num">${s.mods}</div><div class="sub">defined & contracted below</div></div>
      <div class="stat ${s.ready?'good':''}" style="box-shadow:none"><div class="lab">Ready to activate</div><div class="num">${s.ready}</div><div class="sub">gate green · awaiting sign-off</div></div>
    </div></div>`);
  v.appendChild(hero);
  v.appendChild(h(`<h2 style="margin:8px 2px 8px;color:var(--ink-dim);font-size:11.5px;letter-spacing:.5px;text-transform:uppercase">The slots — click a gate item to mark it met</h2>`));
  const wrap=h(`<div></div>`);
  PHASE2.forEach(p=>wrap.appendChild(h(p2Card(p))));
  v.appendChild(wrap);
  // wire: toggle a gate item, or activate a ready module
  wrap.querySelectorAll('.p2gate').forEach(el=>el.onclick=()=>{
    if(!canAct()){flash('Read-only role — gate changes need SHEQ / EoR');return;}
    const p=PHASE2.find(x=>x.id===el.dataset.mod); const g=p.gate[+el.dataset.gi];
    g[2]=!g[2];
    pushEvent('phase2_gate','Phase 2 · '+p.id+' gate item "'+g[0]+'" '+(g[2]?'marked met':'cleared'));
    renderRoadmap();
  });
  wrap.querySelectorAll('[data-act]').forEach(b=>{ if(b.disabled)return; b.onclick=()=>{
    const p=PHASE2.find(x=>x.id===b.dataset.act); if(!p.gate.every(g=>g[2]))return;
    p.activated=true;
    pushEvent('phase2_activation',p.id+' ('+p.name+') activated — gate met, EoR-signed. Now feeds its coverage cell and the fusion adequacy check.');
    flash(p.id+' activated — now live in Phase 2'); renderRoadmap();
  };});
}

function safetyMapSVG(W,H,L){

    const d=pts.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ');

  let danger='';
  if(L.danger){danger=DANGER_POINTS.map(p=>{const x=X(p.x),y=Y(p.y);
    if(p.kind==='access') return `<g><title>Access — ${p.label}</title><rect x="${x-6}" y="${y-6}" width="12" height="12" rx="2" fill="#38bdf8" stroke="#06121b" stroke-width="1.2"/><text x="${x+9}" y="${y+4}" fill="#7dd3fc" font-size="9.5">${p.label}</text></g>`;

function aoiMapSVG(lat,lng,W,H){

  for(let j=1;j<4;j++){const y=(pad+(H-2*pad)*j/4).toFixed(1);grid+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#12303f" stroke-width="1"/>`;}
  const crest=`${cx-150},${cy-50} ${cx+142},${cy-62} ${cx+170},${cy+28} ${cx+42},${cy+68} ${cx-142},${cy+54} ${cx-174},${cy-12}`;
  const calc=`${cx-118},${cy-36} ${cx+114},${cy-44} ${cx+136},${cy+20} ${cx+32},${cy+50} ${cx-114},${cy+40} ${cx-140},${cy-8}`;
  const pond=`${cx+6},${cy-8} ${cx+72},${cy-16} ${cx+88},${cy+14} ${cx+34},${cy+30} ${cx-6},${cy+14}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">
    <rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="#08131c" stroke="#1f3a4f"/>

    <polygon points="${crest}" fill="#37c2b81f" stroke="#37c2b8" stroke-width="2"/>

    <circle cx="${cx}" cy="${cy}" r="4.5" fill="#f4b740" stroke="#160f02" stroke-width="1"/>

function baseMapShapes(W,H){
  const pad=30, cx=W/2, cy=H/2;
  const crest=`${cx-150},${cy-50} ${cx+142},${cy-62} ${cx+170},${cy+28} ${cx+42},${cy+68} ${cx-142},${cy+54} ${cx-174},${cy-12}`;
  const pond=`${cx+6},${cy-8} ${cx+72},${cy-16} ${cx+88},${cy+14} ${cx+34},${cy+30} ${cx-6},${cy+14}`;
  return {pad,cx,cy,
    frame:`<rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="#08131c" stroke="#1f3a4f"/>`,
    crest:`<polygon points="${crest}" fill="#37c2b81a" stroke="#37c2b8" stroke-width="2"/>`,
    pond:`<polygon points="${pond}" fill="#4aa3ff55" stroke="#cfe6ff" stroke-width="1"/>`};
}
function instrMapSVG(W,H,extra){
  W=W||760;H=H||250; const b=baseMapShapes(W,H);
  const px=f=>b.pad+f.x*(W-2*b.pad), py=f=>b.pad+f.y*(H-2*b.pad);
  const dots=instruments.map(i=>{
    const c=i.status==='live'?'#34d399':'#f87171';
    const ring=i.moved?`<circle cx="${px(i.pos)}" cy="${py(i.pos)}" r="9" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 2"/>`:'';
    return `${ring}<circle cx="${px(i.pos)}" cy="${py(i.pos)}" r="4.5" fill="${c}" stroke="#06121b" stroke-width="1.2"/>
      <text x="${px(i.pos)+8}" y="${py(i.pos)+4}" fill="#94a8bd" font-size="10" font-family="ui-monospace,Menlo,monospace">${i.id}</text>`;
  }).join('');
  const cand=extra?`<circle cx="${px(extra.pos)}" cy="${py(extra.pos)}" r="7" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="${px(extra.pos)}" cy="${py(extra.pos)}" r="3.5" fill="#fbbf24"/>
    <text x="${px(extra.pos)+10}" y="${py(extra.pos)+4}" fill="#fcd34d" font-size="10" font-weight="700">${extra.label}</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${b.frame}${b.crest}${b.pond}${dots}${cand}
    <text x="${b.pad+6}" y="${b.pad+15}" fill="#7fa0b5" font-size="11">▲ N</text></svg>`;
}

function droneMapSVG(W,H){
  W=W||760;H=H||250; const b=baseMapShapes(W,H);
  let path='';
  for(let i=0;i<6;i++){const y=b.cy-48+i*20, x1=b.cx-150+i*4, x2=b.cx+150-i*3;
    path+=`M${i%2?x2:x1},${y} L${i%2?x1:x2},${y} `;}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${b.frame}${b.crest}${b.pond}
    <path d="${path}" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="6 4" opacity=".85"/>
    <circle cx="${b.cx-150}" cy="${b.cy-48}" r="5" fill="#fbbf24"/>
    <text x="${b.cx-142}" y="${b.cy-52}" fill="#fcd34d" font-size="10">launch</text>

    <text x="${W-b.pad-6}" y="${H-b.pad-8}" fill="#5f7688" font-size="10" text-anchor="end">Full facility grid · 4 cm/px</text></svg>`;
}

function renderInstruments(){
  const v=$('#view'); v.innerHTML='';
  const live=instruments.filter(i=>i.status==='live').length;

  const calibDue=instruments.filter(i=>i.calibOver).length;
  v.appendChild(h(`<div class="banner info">🧭 <b>The objective streams are only as good as the instruments behind them.</b> This is the register: where each one sits, whether it is reporting, when it was last calibrated — and every relocation, because a monument that moved must be distinguishable from ground that moved. The monitoring system is itself an inspected object.</div>`));

  const grid=h(`<div class="grid g4 mb"></div>`);
  grid.appendChild(h(`<div class="stat ${live<instruments.length?'warn':'good'}"><div class="lab">Reporting</div><div class="num">${live}/${instruments.length}</div><div class="sub">${instruments.length-live} offline (P-07)</div></div>`));
  grid.appendChild(h(`<div class="stat good"><div class="lab">Relocations on record</div><div class="num">${movedN}</div><div class="sub">each justified & ledgered</div></div>`));
  grid.appendChild(h(`<div class="stat ${calibDue?'warn':'good'}"><div class="lab">Calibration</div><div class="num">${calibDue?calibDue+' due':'Current'}</div><div class="sub">${calibDue?'P-04 overdue — Jul 2026':'all instruments in date'}</div></div>`));
  grid.appendChild(h(`<div class="stat good"><div class="lab">Coverage effect</div><div class="num" style="font-size:20px;padding-top:9px">Detection ↑</div><div class="sub">offline device re-scores FMEA (M17)</div></div>`));
  v.appendChild(grid);

  const map=h(`<div class="card mb"><h2>Positions — live map</h2>
    <div class="tiny mute" style="margin:2px 0 8px">Green = reporting · red = offline · dashed blue ring = has a relocation history.</div>
    <div class="chart">${instrMapSVG(1080,250)}</div></div>`);
  v.appendChild(map);

  if(canAct()){const b=h(`<button class="btn" style="margin-bottom:16px">🧭 Add instrument</button>`); b.onclick=addInstrument; v.appendChild(b);}

  const tbl=h(`<div class="card" style="padding:6px 6px 2px"><table><thead><tr><th>ID</th><th>Type</th><th>Position</th><th>Installed</th><th>Calibration</th><th>Power</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div>`);
  instruments.forEach(i=>{
    const p=i.status==='live'?'green':'red';
    const tr=h(`<tr>
      <td class="mono">${i.id}</td><td>${i.type}</td>
      <td>${i.loc}${i.moved?' <span class="pill blue" style="padding:1px 7px;font-size:10px">moved ×'+(i.history.length-1)+'</span>':''}
        <div class="mono" style="font-size:10.5px;margin-top:2px">${i.gps?i.gps.lat.toFixed(4)+', '+i.gps.lng.toFixed(4):'—'}</div></td>
      <td class="muted">${i.installed}</td>
      <td>${i.calibOver?'<span class="pill amber"><span class="dot"></span>'+i.calib+' — overdue</span>':i.calib}</td>
      <td class="muted">${i.batt}</td>
      <td><span class="pill ${p}"><span class="dot"></span>${i.status}</span></td>
      <td style="white-space:nowrap">
        <button class="btn ghost sm" data-a="hist">History</button>
        ${canAct()?'<button class="btn sec sm" data-a="move">Relocate</button>':''}
        ${canAct()&&i.status==='offline'?'<button class="btn sm" data-a="fix">Mark repaired</button>':''}
      </td></tr>`);
    tr.querySelector('[data-a="hist"]').onclick=()=>instrumentHistory(i);
    const mv=tr.querySelector('[data-a="move"]'); if(mv)mv.onclick=()=>relocateInstrument(i);
    const fx=tr.querySelector('[data-a="fix"]'); if(fx)fx.onclick=()=>{
      i.status='live'; i.batt='97%';
      const t=telemetry.find(t=>t.id===i.id); if(t){t.status='live';t.last='just now';t.value='reporting';t.tarp='green';}
      pushEvent('instrument_repaired',i.id+' back online — west-wall coverage restored, Detection re-scored');
      flash(i.id+' marked repaired — coverage restored'); render();};
    tbl.querySelector('tbody').appendChild(tr);
  });
  v.appendChild(tbl);
  v.appendChild(h(`<div class="tiny mute" style="margin-top:10px">Relocation and repair are ledger events. Live readings from these devices are in Inspections → IoT telemetry.</div>`));
}

  openModal('Relocate '+i.id,`

    `<button class="btn" id="ri_save">📍 Record relocation</button>`);
  const preview=()=>{
    const lat=parseFloat($('#ri_lat').value), lng=parseFloat($('#ri_lng').value);
    if(isFinite(lat)&&isFinite(lng))
      $('#ri_map').innerHTML=instrMapSVG(560,190,{pos:gpsToPos(lat,lng),label:i.id+' →'});
  };
  $('#ri_prev').onclick=preview;
  $('#ri_lat').onchange=preview; $('#ri_lng').onchange=preview;
  $('#ri_save').onclick=()=>{
    const loc=$('#ri_loc').value.trim(), why=$('#ri_why').value.trim(), by=$('#ri_by').value.trim()||'Survey team';
    const lat=parseFloat($('#ri_lat').value), lng=parseFloat($('#ri_lng').value);
    if(!loc||!why){flash('New position and reason are required');return;}
    if(!isFinite(lat)||!isFinite(lng)){flash('New coordinates are required');return;}
    if(lat===i.gps.lat&&lng===i.gps.lng){flash('Coordinates unchanged — enter the new position');return;}
    i.history[i.history.length-1].to='today';
    i.history.push({loc:loc+' · '+lat.toFixed(4)+', '+lng.toFixed(4), from:'today', to:null, by, why});

  };

function bandOf(r,v){return r.dir==='low_bad'?(v>=r.bands.green?'green':v>=r.bands.amber?'amber':'red'):(v<r.bands.green?'green':v<r.bands.amber?'amber':'red');}
function evalSatRule(r){
  const v=curScene().vals[r.id], b=r.bands, band=bandOf(r,v);
  const tl={green:'good',amber:'amber',red:'bad'}[band];
  const fill=s=>String(s).replace(/{v}/g,v).replace(/{green}/g,b.green).replace(/{amber}/g,b.amber);
  return {v, band, tl, head:fill(r.stmt[band].h), body:fill(r.stmt[band].b), kbig:fill(r.kpi.big), ksub:fill(r.kpi.sub)};
}

function insarSVG(W,H){
  W=W||720;H=H||300; const b=baseMapShapes(W,H);
  const X=x=>+(b.pad+x*(W-2*b.pad)).toFixed(1), Y=y=>+(b.pad+y*(H-2*b.pad)).toFixed(1);
  const pts=[[.15,.25,'g'],[.35,.16,'g'],[.6,.15,'g'],[.82,.28,'g'],[.9,.5,'g'],[.83,.75,'g'],[.6,.86,'g'],[.36,.87,'a'],[.15,.76,'g'],[.09,.5,'g'],[.28,.5,'g'],[.72,.62,'g']];
  const col={g:'#34d399',a:'#fbbf24',r:'#f87171'};
  const dots=pts.map(([x,y,c])=>`<g><title>PS point · ${c==='g'?'stable':'watch'}</title><circle cx="${X(x)}" cy="${Y(y)}" r="4.5" fill="${col[c]}" stroke="#06121b" stroke-width="1"/></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${b.frame}${b.crest}${b.pond}${dots}
    <text x="${b.pad+6}" y="${b.pad+15}" fill="#7fa0b5" font-size="11">PS points · line-of-sight velocity</text>
    <text x="${W-b.pad-6}" y="${H-b.pad-8}" fill="#5f7688" font-size="10" text-anchor="end">Sentinel-1 · illustrative</text></svg>`;
}
function methaneSVG(W,H){
  W=W||720;H=H||300; const pad=30, iw=W-2*pad-16, cols=18, rows=10, cw=iw/cols, chh=(H-2*pad)/rows;
  const cx=0.44, cy=0.56;
  const ch4=(fx,fy)=>8+52*Math.exp(-(((fx-cx)*(fx-cx))+((fy-cy)*(fy-cy)))/0.045);
  const STOPS=[[59,130,246],[45,212,191],[132,204,22],[250,204,21],[239,68,68]];
  const ramp=v=>{const t=Math.max(0,Math.min(1,v/60)),x=t*(STOPS.length-1),i=Math.min(STOPS.length-2,Math.floor(x)),f=x-i,c=STOPS[i].map((a,k)=>Math.round(a+(STOPS[i+1][k]-a)*f));return `rgb(${c[0]},${c[1]},${c[2]})`;};
  let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const fx=(c+0.5)/cols,fy=(r+0.5)/rows;
    cells+=`<rect x="${(pad+c*cw).toFixed(1)}" y="${(pad+r*chh).toFixed(1)}" width="${(cw+0.6).toFixed(1)}" height="${(chh+0.6).toFixed(1)}" fill="${ramp(ch4(fx,fy))}" opacity="0.9"/>`;}
  let bar='';for(let i=0;i<40;i++){bar+=`<rect x="${W-pad-9}" y="${(pad+i*(H-2*pad)/40).toFixed(1)}" width="9" height="${((H-2*pad)/40+0.8).toFixed(1)}" fill="${ramp(60-(i/40)*60)}"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"><rect width="${W}" height="${H}" fill="#0b1620"/>${cells}
    <rect x="${pad}" y="${pad}" width="${iw}" height="${H-2*pad}" fill="none" stroke="#1f3a4f"/>${bar}
    <text x="${W-pad-11}" y="${pad-4}" fill="#9fb3c6" font-size="9" text-anchor="end">+60</text>
    <text x="${W-pad-11}" y="${H-pad+13}" fill="#9fb3c6" font-size="9" text-anchor="end">+0 ppb</text>
    <text x="${pad+6}" y="${pad+15}" fill="#eaf2f8" font-size="11" font-family="ui-monospace,Menlo,monospace">CH₄ column enhancement (ppb)</text>
    <text x="${pad+6}" y="${H-pad-8}" fill="#9fb3c6" font-size="10">GHGSat / TROPOMI · illustrative</text></svg>`;
}

  else if(step.stream==='drone'){ closeModal(); pushEvent('drone_flight','Drone flight tasked from satellite finding '+r.id+' — '+r.obs); flash('Drone flight tasked to the flagged area'); }

function renderDroneOps(){

    </div>
    ${field('Trigger / link','<input id="pm_trig" class="inp" placeholder="e.g. Scheduled · fortnightly, or job card JC-…">')}
    <div class="banner ${droneWx.status==='go'?'info':'crit'}" style="margin-top:4px">Weather: ${droneWx.wind}, gusts ${droneWx.gusts} — window ${droneWx.window} · <b>${droneWx.status==='go'?'GO':'NO-FLY'}</b></div>`,
    `<button class="btn" id="pm_save">🛫 Schedule mission</button>`);
  $('#pm_save').onclick=()=>{
    const id='DM-'+(dmSeq++);
    droneMissions.unshift({id, date:$('#pm_when').value, type:$('#pm_type').value, area:$('#pm_area').value,
      trigger:$('#pm_trig').value.trim()||'Ad-hoc', pilot:$('#pm_pilot').value, status:'scheduled'});
    pushEvent('drone_mission_planned',id+' scheduled — '+$('#pm_type').value+' ('+$('#pm_area').value+') · '+$('#pm_when').value);
    closeModal(); flash(id+' scheduled'); render();
  };
}

/* =========================== charts (cont.) =========================== */
function trendSVG(){
  const d=adherence.trend, W=680,H=150,pad=24,n=d.length,dx=(W-2*pad)/(n-1);
  const min=35,max=80,y=v=>H-pad-((v-min)/(max-min))*(H-2*pad);
  const line=d.map((v,i)=>`${i?'L':'M'}${(pad+i*dx).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${line} L${(pad+(n-1)*dx).toFixed(1)},${H-pad} L${pad},${H-pad} Z`;
  const base=y(adherence.baseline);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="150" preserveAspectRatio="none">
    <line x1="${pad}" y1="${base}" x2="${W-pad}" y2="${base}" stroke="#5a4713" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-pad}" y="${base-6}" fill="#f4b740" font-size="10" text-anchor="end">paper baseline ${adherence.baseline}%</text>
    <path d="${area}" fill="#2ecc7118"/>
    <path d="${line}" fill="none" stroke="#2ecc71" stroke-width="2.5"/>
    ${d.map((v,i)=>`<circle cx="${(pad+i*dx).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#2ecc71"/>`).join('')}
    <text x="${(pad+(n-1)*dx).toFixed(1)}" y="${y(d[n-1])-9}" fill="#7ce7a8" font-size="11" text-anchor="end" font-weight="700">${d[n-1]}%</text>
  </svg>`;
}
function crossValSVG(W){
  const sat=[42,46,44,50,58,61,60,63], dec=[40,45,46,49,57,62,59,62], H=170,pad=26,n=sat.length,dx=(W-2*pad)/(n-1);
  const min=35,max=68,y=v=>H-pad-((v-min)/(max-min))*(H-2*pad);
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${(pad+i*dx).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const band=sat.map((v,i)=>`${(pad+i*dx).toFixed(1)},${y(v+4).toFixed(1)}`).join(' ')+' '+
    sat.map((v,i)=>`${(pad+(n-1-i)*dx).toFixed(1)},${y(sat[n-1-i]-4).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="170" preserveAspectRatio="none">
    <polygon points="${band}" fill="#4aa3ff18"/>
    <path d="${path(dec)}" fill="none" stroke="#37c2b8" stroke-width="2.5" stroke-dasharray="5 3"/>
    <path d="${path(sat)}" fill="none" stroke="#4aa3ff" stroke-width="2.5"/>
    <circle cx="${(pad+3*dx).toFixed(1)}" cy="${y(50).toFixed(1)}" r="5" fill="#f4b740"/>
    <circle cx="${(pad+6*dx).toFixed(1)}" cy="${y(60).toFixed(1)}" r="5" fill="#f4b740"/>
  </svg>`;
}

/* =========================== status detail + modal =========================== */
function openStatus(s){
  openModal(s.label,`
    <div style="margin-bottom:12px"><span class="pill ${s.state}"><span class="dot"></span>${stateWord(s.state)}</span></div>
    <p class="small" style="line-height:1.6;color:#cfe0ee">${s.detail}</p>
    ${s.state!=='green'?`<div class="banner info" style="margin:12px 0 0">Acknowledging records that the condition was <b>seen</b>. It is <b>not</b> a determination that it is safe — that stays with the Engineer of Record.</div>`:''}`,
    s.state!=='green'&&canAct()?`<button class="btn sec" onclick="flash('Acknowledged — logged');closeModal()">Acknowledge</button><button class="btn" onclick="flash('Escalated to Engineer of Record');closeModal()">⤴️ Escalate to EoR</button>`:'');
}
function openModal(title,bodyHtml,footHtml){
  closeModal();
  const scrim=h(`<div class="scrim"><div class="modal">
    <div class="mh"><h3>${title}</h3><button class="x">✕</button></div>
    <div class="mb">${bodyHtml}</div>
    ${footHtml?`<div class="mb" style="padding-top:0;display:flex;gap:10px;justify-content:flex-end">${footHtml}</div>`:''}
  </div></div>`);
  scrim.onclick=e=>{if(e.target===scrim)closeModal();};
  scrim.querySelector('.x').onclick=closeModal;
  document.body.appendChild(scrim); state.modal=scrim;
}
function closeModal(){if(state.modal){state.modal.remove();state.modal=null;}}

/* =========================== role + boot =========================== */
$('#roleSel').onchange=e=>{
  state.role=e.target.value;
  flash(`Now viewing as ${roleName[state.role]}${state.role==='auditor'?' — read-only':''}`);
  render();
};
$('#facilitySwitch').onclick=()=>flash('Single-facility pilot — portfolio switcher is Phase 2 (M15)');
render();
setTimeout(welcomeModal, 450); // login briefing
</script>
